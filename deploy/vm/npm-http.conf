# CardLearn SDGs (~/cardlearn) on www.cathylanguagehub.com / cathylanguagehub.com -> cardlearn-app container.
# Managed by hand (not in the NPM UI). Certificate: certbot inside stack-npm-1, cert-name "cathylanguagehub",
# renewed by ~/cardlearn/renew-cert.sh (cron). Fallback to the cloud = point DNS back to Vercel (see docs).

# http: Let's Encrypt checks, everything else goes to https
server {
  listen 80;
  listen [::]:80;
  server_name www.cathylanguagehub.com cathylanguagehub.com vm.cathylanguagehub.com;
  set $server "cardlearn-app";
  set $port 8000;
  include conf.d/include/letsencrypt-acme-challenge.conf;
  location / { return 301 https://www.cathylanguagehub.com$request_uri; }
}

# https: the bare domain goes to www
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name cathylanguagehub.com;
  ssl_certificate /etc/letsencrypt/live/cathylanguagehub/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/cathylanguagehub/privkey.pem;
  set $server "cardlearn-app";
  set $port 8000;
  location / { return 301 https://www.cathylanguagehub.com$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.cathylanguagehub.com;
  ssl_certificate /etc/letsencrypt/live/cathylanguagehub/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/cathylanguagehub/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=86400" always;
  client_max_body_size 10m;
  set $server "cardlearn-app";
  set $port 8000;
  # The backend serves frontend/ under /static; Vercel serves it at the root, so map /games/ the same way.
  location /games/ {
    resolver 127.0.0.11 valid=30s;
    set $upstream http://cardlearn-app:8000;
    rewrite ^/games/(.*)$ /static/games/$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / {
    resolver 127.0.0.11 valid=30s;
    set $upstream http://cardlearn-app:8000;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
