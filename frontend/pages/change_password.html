<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>設定密碼 — CardLearn SDGs</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px 16px;
           font-family: Arial, "Microsoft JhengHei", "PingFang TC", sans-serif; color: #0f172a;
           background: radial-gradient(circle at top, #1e1b4b, #030712); }
    .card { width: min(440px, 100%); background: #fff; border-radius: 22px; padding: 28px 26px; box-shadow: 0 40px 100px rgba(0,0,0,.5); }
    h1 { margin: 0 0 6px; font-size: 23px; letter-spacing: -.3px; }
    .lead { margin: 0 0 18px; color: #5b6b86; font-size: 14.5px; line-height: 1.6; }
    label { display: block; margin: 14px 0 6px; font-weight: 800; font-size: 14px; }
    input { width: 100%; border: 1px solid #cbd5e1; border-radius: 12px; padding: 12px 14px; font: inherit; font-size: 16px; }
    input:focus-visible, button:focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }
    .hint { margin: 6px 0 0; color: #64748b; font-size: 13px; }
    .show { display: flex; align-items: center; gap: 8px; margin: 12px 0 0; font-size: 14px; color: #334155; }
    .show input { width: 18px; height: 18px; }
    button { width: 100%; margin-top: 20px; border: 0; border-radius: 12px; padding: 13px 18px; min-height: 48px;
             font-weight: 800; font-size: 16px; color: #fff; cursor: pointer; background: linear-gradient(135deg, #2563eb, #0ea5e9); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .msg { margin: 14px 0 0; padding: 10px 12px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
    .msg.err { background: #fee2e2; color: #7f1d1d; }
    .msg.ok { background: #dcfce7; color: #14532d; }
    .msg:empty { display: none; }
    .out { display: block; margin-top: 16px; text-align: center; color: #64748b; font-size: 13px; }
  </style>
</head>
<body>
  <main class="card">
    <h1 id="title">設定你自己的密碼</h1>
    <p class="lead" id="lead">這是你第一次登入。請把老師給的初始密碼，換成只有你知道的密碼。<br>This is your first sign-in: please choose your own password.</p>
    <form id="form" novalidate>
      <label for="current">目前的密碼 Current password</label>
      <input id="current" type="password" autocomplete="current-password" required />
      <label for="next">新密碼 New password</label>
      <input id="next" type="password" autocomplete="new-password" required minlength="8" />
      <p class="hint">至少 8 個字，要有英文字母和數字。</p>
      <label for="again">再輸入一次新密碼 Confirm</label>
      <input id="again" type="password" autocomplete="new-password" required minlength="8" />
      <label class="show"><input id="show" type="checkbox" /> 顯示密碼</label>
      <p class="msg" id="msg" role="alert"></p>
      <button id="go" type="submit">儲存並繼續</button>
    </form>
    <a class="out" href="#" id="logout">登出，改用別的帳號</a>
  </main>

  <script src="/static/config.js"></script>
  <script src="/static/js/api.js"></script>
  <script>
    const session = auth.requireLogin();
    const params = new URLSearchParams(location.search);
    // Only a path on this site may follow; anything else goes to the member hub.
    const wanted = params.get("next") || "";
    const next = /^\/(?!\/)/.test(wanted) || /^[\w-]+\.html/.test(wanted) ? wanted : "/pages/member_index.html";
    const $ = id => document.getElementById(id);
    if (session.user && !session.user.must_change_password) {
      $("title").textContent = "更改密碼";
      $("lead").textContent = "輸入目前的密碼，再設定新的密碼。";
    }
    function say(text, type = "err") { $("msg").textContent = text; $("msg").className = "msg " + type; }
    $("show").onchange = e => ["current", "next", "again"].forEach(id => { $(id).type = e.target.checked ? "text" : "password"; });
    $("logout").onclick = e => { e.preventDefault(); auth.logout(); };
    $("form").onsubmit = async e => {
      e.preventDefault();
      const current = $("current").value, pw = $("next").value;
      if (!current) return say("請輸入目前的密碼。");
      if (pw.length < 8 || !/[A-Za-z]/.test(pw) || !/\d/.test(pw)) return say("新密碼至少 8 個字，要有英文字母和數字。");
      if (pw !== $("again").value) return say("兩次輸入的新密碼不一樣。");
      if (pw === current) return say("新密碼不能和目前的密碼相同。");
      $("go").disabled = true; say("");
      try {
        await api.auth.changePassword(current, pw);
        say("密碼已更新，帶你回去。", "ok");
        setTimeout(() => { location.href = next; }, 700);
      } catch (error) {
        say(error.message || "沒有成功，請再試一次。");
        $("go").disabled = false;
      }
    };
  </script>
</body>
</html>
