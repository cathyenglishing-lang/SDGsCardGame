<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>故事編輯器 · CardLearn SDGs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Story editor (concept). Visual language: a harbor chart — chart-paper canvas, encounters as ports of
   call, branches as sailing routes. One accent per activity type; everything else stays quiet. */
:root {
  --chart: #eef3f5; --grid: #dbe5ea; --grid-strong: #c7d5dc;
  --ink: #17324d; --ink-2: #4a6075; --ink-3: #7d90a1; --paper: #ffffff; --rule: #d5dfe5;
  --sel: #1d6fd6;
  --t-dialogue: #5b6b7a; --t-reading: #12827d; --t-listening: #4c56d1; --t-speaking: #d9483b;
  --t-cards: #c98a00; --t-choice: #8a4fc4; --t-ending: #2b7a4b;
  --f-ui: "Instrument Sans", "Noto Sans TC", system-ui, sans-serif;
  --f-script: "Newsreader", "Noto Sans TC", Georgia, serif;
  --f-zh: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: var(--f-ui); color: var(--ink); background: var(--chart); font-size: 14px; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }

.app { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }

/* top bar */
.bar { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--paper); border-bottom: 1px solid var(--rule); min-width: 0; }
.back { display: flex; align-items: center; gap: 6px; color: var(--ink-2); text-decoration: none; font-weight: 600; white-space: nowrap; }
.back:hover { color: var(--ink); }
.story-id { display: flex; flex-direction: column; min-width: 0; }
.story-id select { border: 0; background: none; font-size: 17px; font-weight: 700; padding: 0; margin: 0 0 1px -2px; max-width: 100%; }
.story-id small { color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; background: #fff4d6; color: #7a5400; font-weight: 600; font-size: 12px; white-space: nowrap; }
.status i { width: 7px; height: 7px; border-radius: 50%; background: #e0a100; }
.bar .grow { flex: 1; }
.btn { border: 1px solid var(--rule); background: var(--paper); border-radius: 8px; padding: 7px 12px; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.primary:hover { background: #0f2438; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.saved { color: var(--ink-3); font-size: 12px; white-space: nowrap; }

/* body: palette | canvas | inspector */
.body { display: grid; grid-template-columns: 228px minmax(0, 1fr) 344px; min-height: 0; }

.palette { background: var(--paper); border-right: 1px solid var(--rule); padding: 14px 12px; overflow-y: auto; }
.palette h2, .inspector h2 { font-size: 13px; font-weight: 700; margin: 0 0 4px; }
.palette p.help { margin: 0 0 12px; color: var(--ink-3); font-size: 12px; line-height: 1.5; }
.tool { display: grid; grid-template-columns: 30px 1fr; gap: 2px 10px; align-items: center; width: 100%; text-align: left; border: 1px solid transparent; background: none; border-radius: 10px; padding: 8px; margin-bottom: 4px; }
.tool:hover { background: var(--chart); border-color: var(--rule); }
.tool .sw { grid-row: span 2; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-size: 15px; }
.tool b { font-weight: 600; }
.tool span { color: var(--ink-3); font-size: 12px; line-height: 1.35; }
.legend { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--rule); color: var(--ink-3); font-size: 12px; line-height: 1.6; }
.legend kbd { font-family: var(--f-ui); font-size: 11px; padding: 1px 5px; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; background: var(--paper); color: var(--ink-2); }

/* canvas */
.canvas { position: relative; overflow: hidden; cursor: grab; touch-action: none;
  background-color: var(--chart);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px),
                    linear-gradient(var(--grid-strong) 1px, transparent 1px), linear-gradient(90deg, var(--grid-strong) 1px, transparent 1px);
  background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px; }
.canvas.panning { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.edges path.route { fill: none; stroke: var(--ink-3); stroke-width: 2; stroke-dasharray: 6 5; }
.edges path.route.main { stroke: var(--ink); stroke-dasharray: none; }
.edges path.route.sel { stroke: var(--sel); stroke-width: 3; }
.edges path.hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: pointer; }
.edges text { font-family: var(--f-ui); font-size: 11px; fill: var(--ink-2); paint-order: stroke; stroke: var(--chart); stroke-width: 4px; }
.edges path.temp { fill: none; stroke: var(--sel); stroke-width: 2; stroke-dasharray: 4 4; }

.node { position: absolute; width: 230px; background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; box-shadow: 0 1px 0 rgba(23, 50, 77, .06), 0 8px 22px -14px rgba(23, 50, 77, .35); user-select: none; }
.node.sel { border-color: var(--sel); box-shadow: 0 0 0 3px rgba(29, 111, 214, .18), 0 10px 26px -14px rgba(23, 50, 77, .4); }
.node.warn { border-color: #e0a100; }
.node header { display: flex; align-items: center; gap: 8px; padding: 9px 11px 7px; border-bottom: 1px solid var(--rule); cursor: move; }
.node .badge { font-size: 11px; font-weight: 700; color: #fff; border-radius: 5px; padding: 2px 6px; white-space: nowrap; }
.node .stage { margin-left: auto; font-size: 11px; color: var(--ink-3); white-space: nowrap; }
.node .main-txt { padding: 8px 11px 10px; }
.node h3 { margin: 0 0 2px; font-size: 14px; font-weight: 700; line-height: 1.3; }
.node .where { color: var(--ink-3); font-size: 12px; margin-bottom: 6px; }
.node .quote { font-family: var(--f-script); font-style: italic; font-size: 13px; line-height: 1.45; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.node .meta { display: flex; gap: 10px; margin-top: 7px; color: var(--ink-3); font-size: 11px; }
.node .meta b { color: var(--ink-2); font-weight: 600; }
.port { position: absolute; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink-3); }
.port.in { left: -8px; }
.port.out { right: -8px; cursor: crosshair; }
.port.out:hover { border-color: var(--sel); background: #e3eefc; }
.port.out::after { content: ""; position: absolute; inset: -10px; }
.node.ending .port.out { display: none; }
.node.start .port.in { display: none; }

.hud { position: absolute; left: 14px; bottom: 14px; display: flex; gap: 6px; }
.hud button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--rule); background: var(--paper); font-weight: 700; }
.mini { position: absolute; right: 14px; bottom: 14px; width: 200px; height: 130px; background: rgba(255, 255, 255, .9); border: 1px solid var(--rule); border-radius: 10px; cursor: pointer; }
.toast { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 8px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }

/* inspector */
.inspector { background: var(--paper); border-left: 1px solid var(--rule); overflow-y: auto; padding: 14px 16px 24px; }
.inspector .empty { color: var(--ink-3); line-height: 1.6; margin-top: 30px; text-align: center; }
.insp-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.insp-head .badge { font-size: 12px; font-weight: 700; color: #fff; border-radius: 6px; padding: 3px 8px; }
.insp-head .del { margin-left: auto; color: #b3261e; border-color: #f0c9c5; }
.field { display: grid; gap: 4px; margin-bottom: 10px; }
.field label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.field input, .field select, .field textarea { border: 1px solid var(--rule); border-radius: 8px; padding: 7px 9px; background: #fbfcfd; width: 100%; }
.field textarea { resize: vertical; min-height: 56px; line-height: 1.5; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.section { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--rule); }
.section-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; margin-bottom: 8px; }
.section-h h2 { margin: 0; white-space: nowrap; }
.section-h small { flex: 1 1 140px; }
.section-h small { color: var(--ink-3); }
.section-h button { margin-left: auto; }
.line { border: 1px solid var(--rule); border-radius: 10px; padding: 8px; margin-bottom: 8px; background: #fbfcfd; }
.line .who { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
.line .who input { flex: 1; border: 0; background: none; font-weight: 700; padding: 0; }
.line .who button { border: 0; background: none; color: var(--ink-3); padding: 2px 4px; }
.line textarea { width: 100%; border: 0; background: none; resize: vertical; padding: 0; line-height: 1.5; }
.line textarea.en { font-family: var(--f-script); font-size: 15px; color: var(--ink); min-height: 44px; }
.line textarea.zh { font-family: var(--f-zh); font-size: 13px; color: var(--ink-2); min-height: 22px; margin-top: 4px; border-top: 1px dashed var(--rule); padding-top: 4px; }
.line .fit { font-size: 11px; color: var(--ink-3); text-align: right; }
.line .fit.over { color: #b3261e; }
.choice-row { display: grid; grid-template-columns: 1fr 120px 24px; gap: 6px; margin-bottom: 6px; align-items: center; }
.choice-row input, .choice-row select { border: 1px solid var(--rule); border-radius: 7px; padding: 5px 7px; min-width: 0; }
.choice-row button { border: 0; background: none; color: var(--ink-3); }

/* footer: story checks */
.foot { display: flex; align-items: center; gap: 18px; padding: 8px 16px; background: var(--paper); border-top: 1px solid var(--rule); min-width: 0; overflow-x: auto; }
.foot .stat { white-space: nowrap; color: var(--ink-2); }
.foot .stat b { color: var(--ink); font-size: 15px; margin-right: 3px; }
.pk { display: flex; gap: 4px; align-items: center; }
.pk span { font-size: 11px; padding: 3px 7px; border-radius: 5px; background: var(--chart); color: var(--ink-3); white-space: nowrap; }
.pk span.on { background: var(--ink); color: #fff; }
.checks { margin-left: auto; display: flex; gap: 8px; align-items: center; white-space: nowrap; }
.checks .ok { color: var(--t-ending); font-weight: 600; }
.checks .bad { color: #b3261e; font-weight: 600; }

.issues { position: absolute; right: 360px; bottom: 56px; width: 340px; max-height: 50vh; overflow-y: auto; background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; box-shadow: 0 16px 40px -20px rgba(23, 50, 77, .5); padding: 12px 14px; z-index: 5; }
.issues h2 { font-size: 14px; margin: 0 0 8px; }
.issues li { margin-bottom: 6px; line-height: 1.5; }
.issues button.link { border: 0; background: none; color: var(--sel); padding: 0; font-weight: 600; }

@media (max-width: 1100px) {
  .body { grid-template-columns: 196px minmax(0, 1fr) 300px; }
  .tool span { display: none; }
  .issues { right: 316px; }
}
@media (max-width: 820px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
  .body { grid-template-columns: 1fr; }
  .palette { display: flex; gap: 6px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--rule); padding: 8px; }
  .palette h2, .palette p.help, .legend { display: none; }
  .tool { width: auto; grid-template-columns: 26px auto; margin: 0; }
  .tool .sw { width: 26px; height: 26px; grid-row: auto; }
  .canvas { height: 62vh; }
  .inspector { border-left: 0; border-top: 1px solid var(--rule); }
  .mini { display: none; }
  .issues { right: 12px; left: 12px; width: auto; }
  .bar { flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <a class="back" href="/pages/teacher_dashboard.html">‹ 教師後台</a>
    <div class="story-id">
      <select id="storySel" aria-label="選擇故事"></select>
      <small id="storySub"></small>
    </div>
    <span class="status" title="概念版：編輯內容只存在這台瀏覽器，不會改動學生正在玩的遊戲"><i></i>概念版 · 草稿</span>
    <span class="grow"></span>
    <span class="saved" id="saved">尚未儲存</span>
    <button class="btn" id="btnCheck" type="button">檢查故事</button>
    <button class="btn" id="btnExport" type="button">匯出 JSON</button>
    <button class="btn" id="btnReset" type="button">還原範例</button>
    <button class="btn primary" id="btnSave" type="button">儲存草稿</button>
    <button class="btn" type="button" disabled title="概念版：尚未連接遊戲引擎">發佈到遊戲</button>
  </header>

  <div class="body">
    <aside class="palette" aria-label="節點元件">
      <h2>新增節點</h2>
      <p class="help">點一下加到畫面中央，或拖曳到畫布上。從節點右側的圓點拉線，連到下一個節點。</p>
      <div id="tools"></div>
      <div class="legend">
        <div>拖曳空白處平移，滾輪縮放</div>
        <div><kbd>Delete</kbd> 刪除選取的節點或路線</div>
        <div>實線＝主線，虛線＝支線或分支</div>
      </div>
    </aside>

    <main class="canvas" id="canvas" aria-label="故事畫布">
      <div class="world" id="world">
        <svg class="edges" id="edges" width="4000" height="2600"></svg>
        <div id="nodes"></div>
      </div>
      <div class="hud">
        <button type="button" id="zoomOut" aria-label="縮小">−</button>
        <button type="button" id="zoomIn" aria-label="放大">+</button>
        <button type="button" id="fit" aria-label="符合畫面" title="符合畫面">⤢</button>
      </div>
      <canvas class="mini" id="mini" width="400" height="260" aria-label="小地圖"></canvas>
      <div class="toast" id="toast" role="status"></div>
      <div class="issues" id="issues" hidden></div>
    </main>

    <aside class="inspector" id="inspector" aria-label="節點設定"></aside>
  </div>

  <footer class="foot" id="foot"></footer>
</div>

<script src="/static/config.js"></script>
<script src="/static/js/api.js"></script>
<script>
(async () => { // teacher tool: same gate as the teacher dashboard
  if (!auth.requireLogin().access_token) return;
  try { const me = await api.auth.me(); if (!["teacher", "admin"].includes(me.role)) location.href = "/pages/member_index.html"; }
  catch (e) { /* offline preview keeps working; the dashboard link already required a teacher */ }
})();

const TYPES = {
  dialogue:  { zh: "劇情對話", en: "Dialogue",  icon: "💬", desc: "角色台詞，推進故事", sec: 0 },
  reading:   { zh: "閱讀",     en: "Reading",   icon: "📖", desc: "配對筆記與投影片、找關鍵字", sec: 180 },
  listening: { zh: "聽力",     en: "Listening", icon: "🎧", desc: "聽講稿片段，填空或選擇", sec: 120 },
  speaking:  { zh: "口說",     en: "Speaking",  icon: "🎙", desc: "上台念講稿，瀏覽器辨識或錄音", sec: 90 },
  cards:     { zh: "卡牌",     en: "Card game", icon: "🃏", desc: "Pecha Kucha 卡牌配對", sec: 240 },
  choice:    { zh: "選擇",     en: "Choice",    icon: "⑂",  desc: "玩家做決定，分出不同路線", sec: 20 },
  ending:    { zh: "結局",     en: "Ending",    icon: "⚑",  desc: "故事終點與回顧", sec: 30 },
};
// The course's six-part talk template (Pecha Kucha itself only fixes 20 slides × 20 seconds).
const STAGES = ["Introduction 引言", "Problem 問題", "Achievements 成果", "Solutions 解方", "Implications 影響", "Call to action 結語"];
const stEn = s => s.slice(0, s.lastIndexOf(" ")), stZh = s => s.slice(s.lastIndexOf(" ") + 1);
const LEVEL_WPS = { A2: 95 / 60, B1: 110 / 60, B2: 120 / 60 };
const color = t => `var(--t-${t})`;
let uid = 1000; const nid = () => "n" + (++uid);

// ── sample stories (shapes taken from the live games) ──
const L = (who, en, zh) => ({ who, en, zh });
const SAMPLES = {
  harbor: () => ({
    id: "harbor", title: "Innovation Harbor · Can We Trust AI?", sub: "SDG 9-1 · 3D 故事 · 第一章", level: "A2",
    nodes: [
      { id: "start", type: "dialogue", title: "抵達港口", place: "渡輪碼頭", npc: "驗票員", stage: null, x: 40, y: 300, start: true,
        lines: [L("Ticket Officer", "Welcome to Innovation Harbor. Your ticket, please.", "歡迎來到創新港，請出示船票。")] },
      { id: "mei", type: "listening", title: "港口廣播的開場", place: "渡輪碼頭", npc: "港務長 Mei", stage: 0, x: 330, y: 300, main: true,
        activity: { source: "Part 1 · 2 張投影片", task: "每張填 2 個空格", replay: "不限次數" },
        lines: [L("Harbor Master Mei", "Welcome to Innovation Harbor, Envoy. Next week the Port Council votes on one big question: should HARBOR-AI run the whole port?", "歡迎來到創新港，特使。下週港務議會要投票：要不要讓 HARBOR-AI 管理整個港口？"),
                L("HARBOR-AI", "Assessment complete. New pier project: safety score ninety-nine percent. Twelve references cited.", "評估完成。新碼頭計畫：安全指數 99%，引用文獻 12 篇。")] },
      { id: "kai", type: "reading", title: "Kai 的草稿筆記", place: "AI 實驗室廣場", npc: "實習生 Kai", stage: 1, x: 630, y: 160, main: true,
        activity: { source: "Part 2 · 4 段筆記", task: "配對筆記與投影片＋找出定義字", replay: "—" },
        lines: [L("Kai", "Envoy… I have to tell you something. The references in the report? I asked the AI to write them.", "特使……我得坦白一件事。報告裡的參考文獻是我請 AI 寫的。")] },
      { id: "kaiChoice", type: "choice", title: "怎麼回應 Kai？", place: "AI 實驗室廣場", npc: "玩家", stage: 1, x: 930, y: 160,
        choices: [{ label: "陪他一篇一篇查", to: "hsu" }, { label: "立刻通報議會", to: "hsu" }, { label: "先別聲張", to: "reporter" }],
        lines: [L("You", "How do you answer Kai?", "你要怎麼回應凱？")] },
      { id: "hsu", type: "cards", title: "許博士被吹散的講稿", place: "港口檔案館", npc: "許博士", stage: 2, x: 1240, y: 300, main: true,
        activity: { source: "SDG 9-1 · Part 2–5", task: "8 張卡一輪配對", replay: "可重聽" },
        lines: [L("Dr. Hsu", "Why does an AI invent papers with such confidence? Help me put the sentences back on the right slides.", "AI 為什麼能這麼有自信地捏造論文？幫我把句子放回正確的投影片。")] },
      { id: "foreman", type: "listening", title: "領班的日誌", place: "貨櫃碼頭", npc: "領班 Lee", stage: null, x: 630, y: 470,
        activity: { source: "支線 · 1 段", task: "聽出 AI 改航線的時間", replay: "不限次數" },
        lines: [L("Foreman Lee", "On Tuesday the system rerouted every truck. Nobody checked why.", "星期二系統把每輛卡車都改了路線，沒有人查原因。")] },
      { id: "reporter", type: "dialogue", title: "記者追問", place: "議會廣場", npc: "記者 Ana", stage: null, x: 1240, y: 70,
        lines: [L("Ana Reyes", "Envoy, is the report fine? Can I quote you on that?", "特使，報告沒問題嗎？我可以引用你的話嗎？")] },
      { id: "council", type: "speaking", title: "說服議會", place: "議會講台", npc: "議員 Wang", stage: 3, x: 1540, y: 300, main: true,
        activity: { source: "Part 4 · 1 張投影片", task: "朗讀，涵蓋率 80% 以上", replay: "3 次機會" },

// ── checks ──
function check() {
  const out = []; const ids = new Set(story.nodes.map(n => n.id));
  const start = story.nodes.find(n => n.start) || story.nodes[0];
  if (!start) return [{ msg: "故事是空的，從左邊新增第一個節點。" }];
  const seen = new Set([start.id]), q = [start.id];
  while (q.length) { const id = q.shift(); for (const e of story.edges) if (e.from === id && ids.has(e.to) && !seen.has(e.to)) { seen.add(e.to); q.push(e.to); } }
  story.nodes.filter(n => !seen.has(n.id)).forEach(n => out.push({ id: n.id, msg: `「${n.title}」從起點走不到，請拉一條路線連過來。` }));
  story.nodes.filter(n => n.type !== "ending" && !story.edges.some(e => e.from === n.id)).forEach(n => out.push({ id: n.id, msg: `「${n.title}」沒有下一站，玩家會卡在這裡。` }));
  if (!story.nodes.some(n => n.type === "ending" && seen.has(n.id))) out.push({ msg: "沒有可以到達的結局節點。" });
  story.nodes.filter(n => n.type === "choice" && n.choices.length < 2).forEach(n => out.push({ id: n.id, msg: `選擇「${n.title}」只有 ${n.choices.length} 個選項，至少要 2 個。` }));
  const wps = LEVEL_WPS[story.level];
  story.nodes.forEach(n => n.lines.forEach((l, i) => { if (l.en.trim().split(/\s+/).length / wps > 18) out.push({ id: n.id, msg: `「${n.title}」第 ${i + 1} 句以 ${story.level} 語速超過 18 秒。` }); if (!l.en.trim()) out.push({ id: n.id, msg: `「${n.title}」第 ${i + 1} 句還沒有英文台詞。` }); }));
  return out;
}

  const n = { id: nid(), type, title: `新的${t.zh}節點`, place: "", npc: "", stage: null, x: Math.round(x), y: Math.round(y), main: false, lines: [], activity: {}, choices: type === "choice" ? [] : [] };
  if (type === "dialogue") n.lines.push(L("Narrator", "", ""));
  story.nodes.push(n); dirty(); renderAll(); select({ node: n.id }); toast(`已新增${t.zh}節點`);
}
function removeSelected() {
  if (selected?.edge != null) { story.edges.splice(selected.edge, 1); toast("已刪除路線"); }
  else if (selected?.node) {
    const n = story.nodes.find(x => x.id === selected.node); if (!n) return;
    if (n.start) { toast("起點不能刪除"); return; }
    story.nodes = story.nodes.filter(x => x !== n); story.edges = story.edges.filter(e => e.from !== n.id && e.to !== n.id);
    story.nodes.forEach(o => o.choices = o.choices.filter(c => c.to !== n.id));
    toast(`已刪除「${n.title}」`);
  } else return;
  selected = null; dirty(); renderAll();
}

// ── canvas interaction: pan, zoom, drag nodes, connect routes ──
const canvas = $("canvas"), world = $("world");
function applyView() { world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`; drawMini(); }
function toWorld(cx, cy) { const r = canvas.getBoundingClientRect(); return { x: (cx - r.left - view.x) / view.k, y: (cy - r.top - view.y) / view.k }; }
function zoomAt(f, cx, cy) { const r = canvas.getBoundingClientRect(); const px = cx - r.left, py = cy - r.top; const k = Math.min(1.6, Math.max(0.3, view.k * f)); view.x = px - (px - view.x) * k / view.k; view.y = py - (py - view.y) * k / view.k; view.k = k; applyView(); }
function bounds() { const xs = story.nodes.map(n => n.x), ys = story.nodes.map(n => n.y); return { x0: Math.min(...xs), y0: Math.min(...ys), x1: Math.max(...xs) + 240, y1: Math.max(...ys) + 160 }; }
function fit() { if (!story.nodes.length) return; const b = bounds(), r = canvas.getBoundingClientRect(); const k = Math.min(1.1, Math.max(0.3, Math.min((r.width - 60) / (b.x1 - b.x0), (r.height - 60) / (b.y1 - b.y0)))); view = { k, x: (r.width - (b.x1 - b.x0) * k) / 2 - b.x0 * k, y: (r.height - (b.y1 - b.y0) * k) / 2 - b.y0 * k }; applyView(); }
function centerOn(id) { const n = story.nodes.find(x => x.id === id); if (!n) return; const r = canvas.getBoundingClientRect(); view.x = r.width / 2 - (n.x + 115) * view.k; view.y = r.height / 2 - (n.y + 60) * view.k; applyView(); }

let drag = null;
canvas.addEventListener("pointerdown", e => {
  if (e.button !== 0 || e.target.closest(".hud, .mini, .issues")) return;
  const port = e.target.closest(".port.out"), nodeEl = e.target.closest(".node"), hit = e.target.closest("path.hit");
  if (port) { const n = story.nodes.find(x => x.id === nodeEl.dataset.id); drag = { kind: "link", from: n }; }
  else if (nodeEl) { const n = story.nodes.find(x => x.id === nodeEl.dataset.id); const p = toWorld(e.clientX, e.clientY); drag = { kind: "node", n, el: nodeEl, dx: p.x - n.x, dy: p.y - n.y, moved: false }; select({ node: n.id }); }
  else if (hit) { select({ edge: +hit.dataset.edge }); return; }
  else { drag = { kind: "pan", sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y, moved: false }; canvas.classList.add("panning"); }
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", e => {
  if (!drag) return;
  if (drag.kind === "pan") { view.x = drag.vx + e.clientX - drag.sx; view.y = drag.vy + e.clientY - drag.sy; drag.moved = true; applyView(); }
  if (drag.kind === "node") { const p = toWorld(e.clientX, e.clientY); drag.n.x = Math.round((p.x - drag.dx) / 12) * 12; drag.n.y = Math.round((p.y - drag.dy) / 12) * 12; drag.el.style.left = drag.n.x + "px"; drag.el.style.top = drag.n.y + "px"; drag.moved = true; renderEdges(); }
  if (drag.kind === "link") { const s = size(drag.from.id), p = toWorld(e.clientX, e.clientY); const x1 = drag.from.x + s.w, y1 = drag.from.y + s.h / 2, dx = Math.max(40, Math.abs(p.x - x1) / 2); $("temp").setAttribute("d", `M${x1},${y1} C${x1 + dx},${y1} ${p.x - dx},${p.y} ${p.x},${p.y}`); }
});
canvas.addEventListener("pointerup", e => {
  if (!drag) return;
  if (drag.kind === "link") {
    $("temp").setAttribute("d", "");
    const target = document.elementFromPoint(e.clientX, e.clientY)?.closest(".node");
    const to = target?.dataset.id;
    if (to && to !== drag.from.id && !story.edges.some(x => x.from === drag.from.id && x.to === to)) {
      const toNode = story.nodes.find(x => x.id === to);
      if (toNode.start) toast("不能連回起點");
      else { story.edges.push({ from: drag.from.id, to, label: "" }); if (drag.from.type === "choice") drag.from.choices.push({ label: `選項 ${drag.from.choices.length + 1}`, to }); dirty(); renderAll(); toast("已建立路線"); }
    }
  }
  if (drag.kind === "node" && drag.moved) { dirty(); drawMini(); }
  if (drag.kind === "pan" && !drag.moved) select(null);
  canvas.classList.remove("panning"); drag = null;
});
canvas.addEventListener("wheel", e => { e.preventDefault(); zoomAt(e.deltaY < 0 ? 1.1 : 1 / 1.1, e.clientX, e.clientY); }, { passive: false });
$("zoomIn").onclick = () => { const r = canvas.getBoundingClientRect(); zoomAt(1.2, r.left + r.width / 2, r.top + r.height / 2); };
$("zoomOut").onclick = () => { const r = canvas.getBoundingClientRect(); zoomAt(1 / 1.2, r.left + r.width / 2, r.top + r.height / 2); };
$("fit").onclick = fit;
addEventListener("keydown", e => { if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) return; if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); removeSelected(); } });
addEventListener("resize", () => drawMini());

// palette: click adds at the view centre, drag drops where released
$("tools").innerHTML = Object.entries(TYPES).map(([k, t]) => `<button class="tool" type="button" draggable="true" data-type="${k}"><span class="sw" style="background:${color(k)}">${t.icon}</span><b>${t.zh} <small style="color:var(--ink-3);font-weight:500">${t.en}</small></b><span>${t.desc}</span></button>`).join("");
document.querySelectorAll(".tool").forEach(b => {
  b.onclick = () => { const r = canvas.getBoundingClientRect(); const p = toWorld(r.left + r.width / 2 - 115 * view.k, r.top + r.height / 2 - 60 * view.k); addNode(b.dataset.type, p.x, p.y); };
  b.ondragstart = e => e.dataTransfer.setData("text/plain", b.dataset.type);
});
canvas.addEventListener("dragover", e => e.preventDefault());
canvas.addEventListener("drop", e => { e.preventDefault(); const t = e.dataTransfer.getData("text/plain"); if (!TYPES[t]) return; const p = toWorld(e.clientX, e.clientY); addNode(t, p.x - 115, p.y - 40); });

// minimap
function drawMini() {
  const c = $("mini"), g = c.getContext("2d"); if (!story || !c.offsetWidth) return;
  g.clearRect(0, 0, c.width, c.height); if (!story.nodes.length) return;
  const b = bounds(), pad = 16, k = Math.min((c.width - pad * 2) / (b.x1 - b.x0), (c.height - pad * 2) / (b.y1 - b.y0));
  const X = x => pad + (x - b.x0) * k, Y = y => pad + (y - b.y0) * k;
  g.strokeStyle = "#9fb1bf"; g.lineWidth = 2;
  const byId = Object.fromEntries(story.nodes.map(n => [n.id, n]));
  story.edges.forEach(e => { const a = byId[e.from], z = byId[e.to]; if (!a || !z) return; g.beginPath(); g.moveTo(X(a.x + 230), Y(a.y + 50)); g.lineTo(X(z.x), Y(z.y + 50)); g.stroke(); });
  const css = getComputedStyle(document.documentElement);
  story.nodes.forEach(n => { g.fillStyle = css.getPropertyValue(`--t-${n.type}`).trim(); g.fillRect(X(n.x), Y(n.y), 230 * k, 100 * k); });
  const r = canvas.getBoundingClientRect(); g.strokeStyle = "#1d6fd6"; g.lineWidth = 2;
  g.strokeRect(X(-view.x / view.k), Y(-view.y / view.k), r.width / view.k * k, r.height / view.k * k);
  c.onclick = e => { const rr = c.getBoundingClientRect(); const wx = b.x0 + ((e.clientX - rr.left) * c.width / rr.width - pad) / k, wy = b.y0 + ((e.clientY - rr.top) * c.height / rr.height - pad) / k; view.x = r.width / 2 - wx * view.k; view.y = r.height / 2 - wy * view.k; applyView(); };
}

// ── save / export / reset ──
let saveT;
function dirty() { $("saved").textContent = "有未儲存的變更"; clearTimeout(saveT); }
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 1600); }
$("btnSave").onclick = () => { try { localStorage.setItem(key(story.id), JSON.stringify(story)); $("saved").textContent = `已儲存草稿 ${new Date().toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit" })}`; toast("已儲存草稿（這台瀏覽器）"); } catch (e) { toast("瀏覽器不允許儲存，請改用匯出 JSON"); } };
$("btnExport").onclick = () => { const blob = new Blob([JSON.stringify(story, null, 2)], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `${story.id}-story.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast("已匯出 JSON"); };
$("btnReset").onclick = () => { try { localStorage.removeItem(key(story.id)); } catch (e) {} load(story.id); toast("已還原範例內容"); };
$("btnCheck").onclick = showIssues;
$("storySel").innerHTML = `<option value="harbor">Innovation Harbor · Can We Trust AI?</option><option value="sdg4">SDG 4 Pecha Kucha Stage</option>`;
$("storySel").onchange = e => load(e.target.value);

load("harbor");
</script>
</body>
