
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CardLearn SDG - Pro Poker Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<link rel="preload" as="image" href="/static/assets/chips/chip.png">
<style>
:root {
  --poker-ratio: 1.4;
  --card-width: 220px;
  --card-height: calc(var(--card-width) * var(--poker-ratio));
  --back-color-1: #1e3a8a;
  --back-color-2: #1e1b4b;
  --primary-gradient: linear-gradient(135deg, #6366f1, #a855f7);
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: radial-gradient(circle at top, #1e1b4b, #030712);
  color: white;
  min-height: 100vh;
  overflow: hidden;
}

.game-wrapper {
  position: relative;
  height: 100vh;
  padding: 20px;
  display: flex;
  flex-direction: column;
}

.topic-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  width: 80%;
  margin: 0 auto 20px auto;
  z-index: 10;
}

/* ==== Topic Button State ==== */
.topic {
  background: rgba(255,255,255,0.1);
  padding: 15px;
  border-radius: 15px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s;
  border: 2px solid rgba(255,255,255,0.1);
  position: relative;
  user-select: none;
}
.topic:hover:not(.completed) {
  background: rgba(255,255,255,0.18);
  transform: translateY(-2px);
}
.topic.active {
  background: var(--primary-gradient);
  box-shadow: 0 0 20px rgba(168,85,247,0.5);
  border-color: white;
}
/* Completed parts turn green and cannot be clicked again. */
.topic.completed {
  background: linear-gradient(135deg, #064e3b, #065f46) !important;
  border: 2px solid #34d399 !important;
  cursor: not-allowed !important;
  box-shadow: 0 0 18px rgba(52,211,153,0.4);
}
.topic.completed::after {
  content: "Complete";
  position: absolute;
  top: 6px; right: 10px;
  font-size: 0.72em;
  color: #6ee7b7;
  font-weight: bold;
}

#status {
  text-align: center;
  font-size: 1.4em;
  font-weight: bold;
  height: 1.5em;
  color: #cbd5e1;
}

.subtopic-box {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 30px;
  perspective: 2000px;
}

/* ==== Poker Cards ==== */
.poker-card {
  width: var(--card-width);
  height: var(--card-height);
  position: relative;
  perspective: 1500px;
}
.card-inner {
  position: absolute;
  width: 100%; height: 100%;
  transition: transform 0.6s cubic-bezier(0.4,0,0.2,1);
  transform-style: preserve-3d;
  box-shadow: 0 10px 20px rgba(0,0,0,0.4);
  border-radius: 12px;
}
.subtopic-poker .card-inner { transform: none !important; }
.poker-card.draggable.flipped .card-inner { transform: rotateY(180deg); }

.card-front, .card-back {
  position: absolute;
  width: 100%; height: 100%;
  border-radius: 12px;
  backface-visibility: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 15px;
  box-sizing: border-box;
  border: 1px solid rgba(255,255,255,0.2);
}
.card-front {
  background: white;
  color: #0f172a;
  font-weight: bold;
  font-size: 1.2em;
  text-align: center;
}
.card-back {
  background-color: var(--back-color-1);
  background-image:
    radial-gradient(circle at center, rgba(255,255,255,0.1) 0%, transparent 70%),
    repeating-conic-gradient(from 0deg, var(--back-color-1) 0deg 90deg, var(--back-color-2) 90deg 180deg);
  background-size: 100% 100%, 20px 20px;
  color: gold;
  font-size: 1.8em;
  font-weight: 900;
  border: 4px double rgba(255,215,0,0.3);
  transform: rotateY(180deg);
  backface-visibility: hidden;
}

@keyframes flyIn {
  from { opacity:0; transform:translate(400px,400px) rotate(45deg) scale(0.5); }
  to   { opacity:1; transform:translate(0,0) rotate(0deg) scale(1); }
}
.subtopic-poker.dealing {
  animation: flyIn 0.6s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
}
.subtopic-poker.correct .card-inner { box-shadow: 0 0 30px #22c55e; }

/* ==== Dealing Area ==== */
.deck-panel {
  position: fixed;
  right: 50px; bottom: 50px;
  z-index: 100;
}
.deck {
  background-color: var(--back-color-1);
  background-image:
    radial-gradient(circle at center, rgba(255,255,255,0.1) 0%, transparent 70%),
    repeating-conic-gradient(from 0deg, var(--back-color-1) 0deg 90deg, var(--back-color-2) 90deg 180deg);
  background-size: 100% 100%, 20px 20px;
  border: 3px solid white;
  transform: rotate(5deg);
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}
.deck:hover { transform: rotate(5deg) scale(1.05); box-shadow: 0 0 20px rgba(255,255,255,0.2); }
.dealt-card-container {
  position: absolute;
  bottom: calc(var(--card-height) + 30px);
  right: 10px;
  width: var(--card-width);
  height: var(--card-height);
}
.poker-card.draggable {
  cursor: grab;
  animation: dealOut 0.5s ease-out forwards;
}
@keyframes dealOut {
  0%   { transform:translate(50px,150px) rotate(20deg); opacity:0; }
  100% { transform:translate(0,0) rotate(-5deg); opacity:1; }
}

/* ==== Timer ==== */
#gameTimer {
  position: fixed;
  bottom: 50px; left: 50px;
  z-index: 100;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 2.2em;
  font-weight: bold;
  color: #fde047;
  text-shadow: 0 0 12px rgba(253,224,71,0.5);
  letter-spacing: 3px;
  user-select: none;
}
#gameTimer .timer-label {
  display: block;
  font-size: 0.4em;
  letter-spacing: 2px;
  color: #94a3b8;
  margin-bottom: 2px;
}

/* ==== Speech Caption Box ==== */
#sentenceBox {
  position: fixed;
  bottom: 80px; left: 50%;
  transform: translateX(-50%);
  background: rgba(15,23,42,0.95);
  padding: 20px 40px;
  border-radius: 20px;
  opacity: 0; visibility: hidden;
  transition: all 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
  border: 2px solid #6366f1;
  z-index: 200;
  max-width: 85%;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  line-height: 1.6;
}
#sentenceBox.active { opacity:1; visibility:visible; bottom:100px; }
#sentenceBox .sentence-text {
  color: #e2e8f0;
  font-size: 1.65em;
  font-weight: 700;
  line-height: 1.55;
}

@keyframes shake {
  0%,100% { transform:translateX(0); }
  25%      { transform:translateX(-8px); }
  75%      { transform:translateX(8px); }
}

/* ════ Toast ════ */
#toast {
  position: fixed;
  top: 30px; left: 50%;
  transform: translateX(-50%) translateY(-100px);
  background: rgba(15,23,42,0.97);
  border: 1px solid #6366f1;
  color: white;
  padding: 12px 30px;
  border-radius: 50px;
  font-size: 1em; font-weight: 600;
  z-index: 999;
  transition: transform 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
  pointer-events: none;
  white-space: nowrap;
}
#toast.show { transform: translateX(-50%) translateY(0); }


/* ===== Enhanced layout + interaction polish ===== */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 18% 18%, rgba(99,102,241,.28), transparent 32%),
    radial-gradient(circle at 82% 20%, rgba(34,197,94,.18), transparent 28%),
    linear-gradient(180deg, rgba(255,255,255,.05), transparent 45%);

}
.game-wrapper {
  box-sizing: border-box;
  max-width: 1440px;
  margin: 0 auto;
}
.game-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 12px;
}
.game-title {
  margin: 0;
  font-size: clamp(1.35rem, 2vw, 2rem);
  letter-spacing: .03em;
}
.progress-panel {
  min-width: 240px;
  padding: 12px 14px;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 18px;
  background: rgba(15,23,42,.62);
  backdrop-filter: blur(18px);
  box-shadow: 0 16px 42px rgba(0,0,0,.25);
}
.progress-text {
  display: flex;
  justify-content: space-between;
  color: #cbd5e1;
  font-size: .82rem;
  margin-bottom: 8px;
}
.progress-bar {
  height: 8px;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(148,163,184,.25);
}
.progress-fill {
  height: 100%;
  width: 0%;
  border-radius: inherit;
  background: linear-gradient(90deg,#22c55e,#fde047,#a855f7);
  transition: width .35s ease;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.super-finish-btn {
  display: none;
  min-height: 40px;
  border: 1px solid rgba(251,191,36,.45);
  border-radius: 8px;
  padding: 0 14px;
  color: #451a03;
  background: linear-gradient(135deg, #fde68a, #f59e0b);
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 12px 28px rgba(245,158,11,.22);
}
.super-finish-btn.show {
  display: inline-flex;
  align-items: center;
}
.topic-grid {
  width: min(1120px, 94vw);
  gap: 12px;
}
.topic {
  min-height: 62px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.06));
  backdrop-filter: blur(14px);
}
.topic strong { letter-spacing: .02em; }
.topic small { color: #cbd5e1; line-height: 1.35; }
#status {
  margin: 4px auto 0;
  min-height: 34px;
  height: auto;
  padding: 8px 18px;
  width: fit-content;
  max-width: min(920px, 92vw);
  border-radius: 999px;
  background: rgba(15,23,42,.56);
  border: 1px solid rgba(255,255,255,.1);
  box-shadow: 0 14px 38px rgba(0,0,0,.18);
}
.subtopic-box {
  gap: clamp(14px, 2vw, 30px);
  align-items: center;
  padding: 18px 310px 110px 40px;
  box-sizing: border-box;
}
.subtopic-poker { transition: transform .2s ease, filter .2s ease; }
.subtopic-poker:hover:not(.correct) { filter: brightness(1.08); }
.subtopic-poker.correct { transform: translateY(-6px); }
.dealt-card-container { filter: drop-shadow(0 22px 30px rgba(0,0,0,.35)); }
.card-front { overflow: hidden; }
.card-controls {
  position: absolute;
  left: 50%;
  bottom: -62px;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 8px;
  width: max-content;
  z-index: 30;
}
.card-action-btn {
  border: 0;
  border-radius: 999px;
  padding: 10px 14px;
  font-weight: 800;
  color: white;
  background: linear-gradient(135deg,#22c55e,#16a34a);
  box-shadow: 0 12px 24px rgba(22,163,74,.28);
  cursor: pointer;
  transition: transform .18s ease, opacity .18s ease, box-shadow .18s ease;
}
.card-action-btn:hover:not(:disabled) { transform: translateY(-2px) scale(1.03); }
.card-action-btn:disabled { opacity: .48; cursor: not-allowed; box-shadow: none; }
.card-action-btn.secondary { background: linear-gradient(135deg,#6366f1,#a855f7); }
.repeat-count-chip {
  color: #fde68a;
  background: rgba(15,23,42,.88);
  border: 1px solid rgba(253,224,71,.22);
  border-radius: 999px;
  padding: 9px 12px;
  font-size: .82rem;
  font-weight: 800;
  white-space: nowrap;
}
#sentenceBox {
  max-height: 42vh;
  overflow-y: auto;
  scrollbar-width: thin;
}
#gameTimer {
  padding: 12px 16px;
  border-radius: 18px;
  background: rgba(15,23,42,.62);
  border: 1px solid rgba(255,255,255,.1);
  backdrop-filter: blur(16px);
}
.deck::after {
  content: "CLICK TO DEAL";
  position: absolute;
  left: 50%;
  bottom: -34px;
  transform: translateX(-50%);
  color: #cbd5e1;
  font-size: .72rem;
  letter-spacing: .12em;
  white-space: nowrap;
}
@media (max-width: 1080px) {
  :root { --card-width: 185px; }
  .topic-grid { grid-template-columns: repeat(2, 1fr); }
  .subtopic-box { padding-right: 230px; flex-wrap: wrap; align-content: center; }

}

  .subtopic-box { padding: 20px 12px 120px; }
  .deck-panel { position: fixed; right: 16px; bottom: 24px; }
  #gameTimer { left: 16px; bottom: 24px; font-size: 1.5em; }
  #sentenceBox .sentence-text { font-size: 1.25em; }
}



/* ===== Final relayout: keep hand card, deck, timer, and subtitles from covering each other ===== */

  --safe-bottom: 150px;
}
body {
  overflow: hidden;
}

}
.game-header {
  margin-right: 0;
}
.topic-grid {

  --side-panel-width: 252px;
  --card-radius: 18px;
}
.poker-card {
  border-radius: var(--card-radius);
}
.card-inner {
  border-radius: var(--card-radius);
  box-shadow: 0 14px 28px rgba(0,0,0,.32);
  transition: transform .22s ease, box-shadow .22s ease, filter .22s ease;
}
.card-front,

.card-front {
  justify-content: flex-start;

  flex-direction: column;
  box-sizing: border-box;

.card-kicker,

  align-self: flex-start;

  flex: 1;

  text-align: left;

.subtopic-box {
  grid-template-columns: repeat(auto-fit, minmax(142px, 1fr));

}
.deck-panel {
  padding: 14px 12px;

/* ── Casino effects of the card table (2026-11-09 「像真實賭場一樣」) ──
   Deal from the shoe with a 3D flip, a gold burst and a star on a match, chips flying into this
   run's pile, a bounce-back on a miss, cards swept off between parts, gold light and confetti when a
   part or the run is done. Transform and opacity only (smooth on an iPad); nothing moves when the
   device asks for reduced motion. Every effect is fire-and-forget: the game's state, its timers and
   its learning events never wait for an animation. */
window.PKFX = (() => {
  const mq = window.matchMedia ? matchMedia("(prefers-reduced-motion: reduce)") : { matches:false };
  const motion = () => !mq.matches && typeof Element.prototype.animate === "function";
  const layers = {};
  function layer(kind){
    let l = layers[kind];
    if(!l || !l.isConnected){ l = layers[kind] = document.createElement("div"); l.className = "pkfx-layer " + kind; l.setAttribute("aria-hidden", "true"); document.body.appendChild(l); }
    return l;
  }
  const mid = el => { const r = el && el.getBoundingClientRect(); return r && (r.width || r.height) ? { x:r.left + r.width / 2, y:r.top + r.height / 2, w:r.width, h:r.height, r } : null; };
  function sprite(cls, x, y, kind){ const e = document.createElement("div"); e.className = "pkfx " + cls; e.style.left = x + "px"; e.style.top = y + "px"; layer(kind || "play").appendChild(e); return e; }
  // Remove the sprite when its animation ends (also if the tab was hidden and the browser never ran it).
  function after(anim, el, cb){
    let ran = false; const end = () => { if(ran) return; ran = true; el.remove(); if(cb) cb(); };
    anim.onfinish = end; anim.oncancel = end;
    let t = 3000; try{ t = anim.effect.getComputedTiming().endTime; }catch(e){}
    setTimeout(end, t + 500);
  }
  const rnd = (a, b) => a + Math.random() * (b - a);

  // A title card flies from the shoe face down, then turns over where it lands.
  function dealIn(card, deck){
    const c = card.getBoundingClientRect(), d = deck && deck.getBoundingClientRect();
    if(!d || !d.width || !c.width){ card.classList.remove("pk-facedown"); return; }
    const dx = d.left + d.width / 2 - (c.left + c.width / 2), dy = d.top + d.height / 2 - (c.top + c.height / 2), sc = Math.max(.35, Math.min(1, d.width / c.width));
    card.animate([
      { transform:`translate(${dx}px,${dy}px) scale(${sc}) rotate(-16deg)`, opacity:0 },
      { transform:`translate(${dx}px,${dy}px) scale(${sc}) rotate(-16deg)`, opacity:1, offset:.1 },
      { transform:`translate(${dx * .38}px,${dy * .38 - 70}px) scale(${(1 + sc) / 2 * 1.1}) rotate(-5deg)`, offset:.62 },
      { transform:"none", opacity:1 }
    ], { duration:600, easing:"cubic-bezier(.2,.65,.25,1)" });
    setTimeout(() => card.classList.remove("pk-facedown"), 430);
  }
  // The sentence card slides off the shoe into the hand, turning face up on the way.
  function dealHand(card, deck){
    const c = card.getBoundingClientRect(), d = deck && deck.getBoundingClientRect();
    if(!d || !d.width || !c.width) return;
    card.style.animation = "none"; card.classList.add("pk-facedown");
    const dx = d.left + d.width / 2 - (c.left + c.width / 2), dy = d.top + d.height / 2 - (c.top + c.height / 2), sc = Math.max(.2, Math.min(1, d.width / c.width));
    card.animate([
      { transform:`translate(${dx}px,${dy}px) scale(${sc}) rotate(10deg)` },
      { transform:`translate(${dx * .42}px,${dy * .42 - 46}px) scale(${(1 + sc) / 2}) rotate(3deg)`, offset:.55 },
      { transform:"none" }
    ], { duration:480, easing:"cubic-bezier(.22,.7,.25,1)" });
    setTimeout(() => card.classList.remove("pk-facedown"), 260);
  }
  function burst(at, big){
    const ring = sprite("pkfx-ring", at.x, at.y);
    after(ring.animate([{ transform:"translate(-50%,-50%) scale(.25)", opacity:1 }, { transform:`translate(-50%,-50%) scale(${big ? 2.3 : 1.6})`, opacity:0 }], { duration:560, easing:"cubic-bezier(.2,.7,.3,1)" }), ring);
    const n = big ? 12 : 7;
    for(let i = 0; i < n; i++){
      const a = i / n * Math.PI * 2 + rnd(-.2, .2), r = rnd(60, big ? 120 : 80), s = sprite("pkfx-spark", at.x, at.y);
      after(s.animate([{ transform:`translate(-50%,-50%) rotate(${a}rad) translateX(10px) scaleX(.4)`, opacity:1 },
                       { transform:`translate(-50%,-50%) rotate(${a}rad) translateX(${r}px) scaleX(1)`, opacity:0 }], { duration:rnd(420, 620), easing:"cubic-bezier(.15,.7,.3,1)" }), s);
    }
  }
  function star(from, toEl){
    const to = mid(toEl); if(!to) return;
    const s = sprite("pkfx-star", from.x, from.y); s.textContent = "★";
    const dx = to.x - from.x, dy = to.y - from.y;
    after(s.animate([
      { transform:"translate(-50%,-50%) scale(.3) rotate(0deg)", opacity:0 },
      { transform:"translate(-50%,-50%) translate(0,-26px) scale(1.5) rotate(40deg)", opacity:1, offset:.22 },
      { transform:`translate(-50%,-50%) translate(${dx * .5}px,${dy * .5 - 60}px) scale(1.1) rotate(200deg)`, offset:.62 },
      { transform:`translate(-50%,-50%) translate(${dx}px,${dy}px) scale(.45) rotate(360deg)`, opacity:.9 }
    ], { duration:820, easing:"cubic-bezier(.35,.1,.3,1)" }), s, () => { try{ toEl.animate([{ scale:"1" }, { scale:"1.3" }, { scale:"1" }], { duration:320, easing:"ease-out" }); }catch(e){} });
  }
  function matchWin(card, first){
    if(!motion()) return;
    const at = mid(card); if(!at) return;
    burst(at, first);
    card.animate([{ scale:"1" }, { scale:"1.09", offset:.35 }, { scale:"1" }], { duration:420, easing:"cubic-bezier(.3,1.6,.5,1)" });
    star(at, document.querySelector("#topicGrid .topic.active"));
  }
  // Chips from a card (or the middle of the table) to the pile, one after another; each one is
  // reported when it lands, so the number counts up with the clink.
  function chipsTo(fromEl, toEl, n, land, kind){
    const f = mid(fromEl), t = mid(toEl);
    if(!f || !t){ for(let i = 0; i < n; i++) land(); return; }
    for(let i = 0; i < n; i++){
      const e = sprite("pkfx-chip", f.x, f.y, kind), jx = rnd(-26, 26), jy = rnd(-18, 18);
      const dx = t.x - f.x, dy = t.y - f.y - Math.min(14, t.h * .2), lift = -Math.max(80, Math.abs(dx) * .22);
      after(e.animate([
        { transform:`translate(-50%,-50%) translate(${jx}px,${jy}px) scale(.35) rotateX(70deg)`, opacity:0 },
        { transform:`translate(-50%,-50%) translate(${jx}px,${jy - 34}px) scale(1.2) rotateX(18deg) rotate(80deg)`, opacity:1, offset:.18 },
        { transform:`translate(-50%,-50%) translate(${dx * .55}px,${dy * .55 + lift}px) scale(1) rotateX(38deg) rotate(250deg)`, offset:.62 },
        { transform:`translate(-50%,-50%) translate(${dx}px,${dy}px) scale(.6) rotateX(64deg) rotate(360deg)`, opacity:1 }
      ], { duration:820, delay:i * 140, easing:"cubic-bezier(.35,.1,.3,1)", fill:"backwards" }), e, land);
    }
  }
  // Part of a chip: a gold spark from the card into the ring beside the pile.
  function spark(fromEl, toEl){
    if(!motion()) return;
    const f = mid(fromEl), t = mid(toEl); if(!f || !t) return;
    const s = sprite("pkfx-star small", f.x, f.y); s.textContent = "✦";
    const dx = t.x - f.x + t.w * .45, dy = t.y - f.y - t.h * .1;
    after(s.animate([{ transform:"translate(-50%,-50%) scale(.4)", opacity:0 }, { transform:"translate(-50%,-50%) translate(0,-20px) scale(1.2)", opacity:1, offset:.2 },
                     { transform:`translate(-50%,-50%) translate(${dx}px,${dy}px) scale(.5) rotate(180deg)`, opacity:.9 }], { duration:760, easing:"cubic-bezier(.35,.1,.3,1)" }), s);
  }
  function clink(el, kind){
    if(!motion()) return;
    const at = mid(el); if(!at) return;
    const r = sprite("pkfx-clink", at.x, at.y - at.h * .15, kind);
    after(r.animate([{ transform:"translate(-50%,-50%) scale(.3)", opacity:1 }, { transform:"translate(-50%,-50%) scale(1.5)", opacity:0 }], { duration:380, easing:"ease-out" }), r);
  }
  function miss(card){
    card.classList.remove("pk-miss"); void card.offsetWidth; card.classList.add("pk-miss");
    setTimeout(() => card.classList.remove("pk-miss"), 520);
    if(!motion()) return;
    card.animate([
      { transform:"none" }, { transform:"translate(-11px,-4px) rotate(-4deg)", offset:.2 }, { transform:"translate(9px,0) rotate(3deg)", offset:.45 },
      { transform:"translate(-5px,0) rotate(-1.5deg)", offset:.7 }, { transform:"none" }
    ], { duration:460, easing:"ease-out" });
    const hand = document.querySelector("#dealtCardHolder .poker-card");
    if(hand) hand.animate([{ transform:"none" }, { transform:"translateY(-22px) rotate(2deg)", offset:.35 }, { transform:"none" }], { duration:420, easing:"cubic-bezier(.3,1.5,.5,1)" });
  }
  // The cards of the last part slide off the table to the side before the next deal. The game
  // clears the table at once; what moves is a copy.
  function sweep(box){
    if(!motion() || !box) return;
    const cards = [...box.querySelectorAll(".subtopic-poker")]; if(!cards.length) return;
    const host = document.createElement("div"); host.className = "pkfx-sweep"; host.inert = true; host.setAttribute("aria-hidden", "true");
    document.getElementById("gameScreen").appendChild(host);
    let left = cards.length;
    const gone = () => { if(--left <= 0) host.remove(); };
    cards.forEach((c, i) => {
      const r = c.getBoundingClientRect(); if(!r.width){ gone(); return; }
      const k = c.cloneNode(true); k.removeAttribute("id"); k.classList.remove("dealing", "pk-facedown", "drop-ready", "drop-over");
      k.style.cssText = `position:fixed;left:${r.left}px;top:${r.top}px;margin:0;rotate:0deg;animation:none`;
      k.style.setProperty("width", r.width + "px", "important"); k.style.setProperty("height", r.height + "px", "important");
      host.appendChild(k);
      const a = k.animate([{ transform:"none", opacity:1 }, { transform:`translate(${innerWidth - r.left + 80}px,${rnd(-60, 30)}px) rotate(${rnd(20, 40)}deg) scale(.7)`, opacity:.2 }],
                          { duration:520, delay:i * 55, easing:"cubic-bezier(.5,0,.75,.3)", fill:"both" });
      let done = false; a.onfinish = a.oncancel = () => { if(done) return; done = true; k.remove(); gone(); };
    });
    setTimeout(() => host.remove(), 2000);
  }
  function shine(box){
    const at = mid(box); if(!at) return;
    const s = sprite("pkfx-shine", at.r.left, at.r.top);
    s.style.width = at.w + "px"; s.style.height = at.h + "px";
    const band = document.createElement("i"); s.appendChild(band);
    after(band.animate([{ transform:"translateX(-120%) skewX(-18deg)" }, { transform:"translateX(320%) skewX(-18deg)" }], { duration:900, easing:"ease-in-out" }), s);
  }
  function confetti(n, from){
    const colors = ["#f4d27a", "#e0a92b", "#a78bfa", "#6d4df2", "#34d399", "#ef4444", "#fbf7ee"];
    for(let i = 0; i < n; i++){
      const x = from ? from.x : rnd(0, innerWidth), y = from ? from.y : -20;
      const p = sprite("pkfx-confetti", x, y, "top"); p.style.background = colors[i % colors.length];
      const dx = from ? rnd(-160, 160) : rnd(-80, 80), dy = from ? rnd(-150, 60) : innerHeight + 60, spin = rnd(360, 1080);
      const frames = from
        ? [{ transform:"translate(-50%,-50%) scale(.4)", opacity:1 }, { transform:`translate(-50%,-50%) translate(${dx}px,${dy}px) rotate(${spin}deg) rotateX(${spin}deg)`, opacity:1, offset:.6 }, { transform:`translate(-50%,-50%) translate(${dx * 1.2}px,${dy + 160}px) rotate(${spin * 1.3}deg)`, opacity:0 }]
        : [{ transform:"translate(-50%,-50%)", opacity:1 }, { transform:`translate(-50%,-50%) translate(${dx}px,${dy}px) rotate(${spin}deg) rotateY(${spin}deg)`, opacity:.9 }];
      after(p.animate(frames, { duration:from ? rnd(900, 1300) : rnd(1800, 2900), delay:from ? 0 : rnd(0, 450), easing:from ? "cubic-bezier(.2,.6,.4,1)" : "cubic-bezier(.25,.4,.45,1)", fill:"backwards" }), p);
    }
  }
  function partWin(box, chip){
    if(!motion()) return;
    shine(box);
    [...box.querySelectorAll(".subtopic-poker.correct")].forEach((c, i) =>
      c.animate([{ translate:"0 0" }, { translate:"0 -14px", offset:.4 }, { translate:"0 0" }], { duration:420, delay:120 + i * 70, easing:"cubic-bezier(.3,1.4,.5,1)" }));
    if(chip){
      try{ chip.animate([{ rotate:"y 0deg", scale:"1" }, { rotate:"y 180deg", scale:"1.35" }, { rotate:"y 360deg", scale:"1" }], { duration:760, easing:"cubic-bezier(.3,.7,.3,1)" }); }catch(e){}
      const at = mid(chip); if(at) confetti(innerWidth <= 640 ? 12 : 18, at);
    }
  }
  // The whole talk is done: gold light over the table and confetti over everything (the wrap-up
  // opens underneath it on its usual timer).
  function runWin(box){
    if(!motion()) return;
    const at = mid(box);
    if(at){
      shine(box);
      const g = sprite("pkfx-glow", at.x, at.y);
      after(g.animate([{ transform:"translate(-50%,-50%) scale(.4)", opacity:0 }, { transform:"translate(-50%,-50%) scale(1)", opacity:.9, offset:.3 }, { transform:"translate(-50%,-50%) scale(1.3)", opacity:0 }], { duration:1300, easing:"ease-out" }), g);
    }
    confetti(innerWidth <= 640 ? 45 : 80);
  }
  return { motion, dealIn, dealHand, matchWin, chipsTo, spark, clink, miss, sweep, partWin, runWin, confetti, burst, mid };
})();
</script>
<script>
// An account made by a roster import chooses its own password before anything else.
(function(){ try{ const s=JSON.parse(localStorage.getItem("user")||"null"); if(s&&s.user&&s.user.must_change_password&&window.parent===window) location.replace("/pages/change_password.html?next="+encodeURIComponent(location.pathname+location.search)); }catch(e){} })();
/* ── Voice preload ── */
let cachedVoice = null;
function loadPreferredVoice() {
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return;
  cachedVoice =
    voices.find(v => v.name === 'Google US English') ||
    voices.find(v => v.name.includes('Aria')) ||
    voices.find(v => v.lang === 'en-US' && !v.localService) ||
    voices.find(v => v.lang === 'en-US') || null;
}
window.speechSynthesis.onvoiceschanged = loadPreferredVoice;
loadPreferredVoice();

/* ── Self-contained (no login / no backend) ── */
const user = null;
const canUseSuperFinish = false;
// The material comes from the teacher's library (GET /content/library, backend/content_library.py).
// frontend/js/pk-content.js is the copy that ships with the page: it is used until the library
// answers, and instead of it when the server cannot be reached.
let GAME_DATA = window.PK_CONTENT;
let PK_LIBRARY = false;                                          // true once the library's copy is in use
const PK_PREVIEW = new URLSearchParams(location.search).get("preview") === "1";   // a teacher trying an unpublished draft
async function pkLoadLibrary(){
  const base = String(window.CARDLEARN_API_BASE_URL || "").replace(/\/+$/, "");
  if(!base) return;
  try{
    const r = await fetch(base + "/content/library?game=pecha_kucha");
    if(!r.ok) return;
    const data = await r.json();
    if(data && Array.isArray(data.topics) && data.topics.length){ GAME_DATA = { topics: data.topics }; PK_LIBRARY = true; }
    if(PK_PREVIEW && PK_LINK.topic){
      const who = JSON.parse(localStorage.getItem("user") || "null");
      const d = await fetch(base + "/teacher/library/pecha_kucha/" + encodeURIComponent(PK_LINK.topic), { headers: { Authorization: "Bearer " + ((who && who.access_token) || "") } });
      if(d.ok){
        const t = await d.json();
        const doc = { ...t.doc, id: PK_LINK.topic, version: t.summary.version, locked: false };
        GAME_DATA = { topics: GAME_DATA.topics.filter(x => x.id !== doc.id).concat([doc]) };
      }
    }
  }catch(e){ /* offline: the shipped copy stays */ }
}
let SELECTED = { topic: null, level: null };

const SDG_META = {
  4:{c:"#c5192d", n:"Quality Education"},
  5:{c:"#ff3a21", n:"Gender Equality"},
  9:{c:"#fd6925", n:"Industry, Innovation & Infrastructure"},
  13:{c:"#3f7e44", n:"Climate Action"},
};
const LEVEL_LABEL = {A1:"Beginner", A2:"Elementary", B1:"Intermediate", B2:"Upper-intermediate"};
const LEVEL_ORDER = ["A1","A2","B1","B2"];
// Card game: one playable topic per SDG (the most complete one); every other topic stays visible but locked.
// Embedded runs from the 3D game (embed=harbor) may open any topic.
// ?topic=9-1&level=B1&parts=3,4&embed=harbor — start directly; embed=harbor reports back to the 3D game.
const PK_LINK = (() => {
  const q = new URLSearchParams(location.search);
  return {
    topic: q.get("topic"),
    level: q.get("level") || "A2",
    parts: (q.get("parts") || "").split(",").map(Number).filter(Boolean),
    merge: q.get("merge") === "1",
    embed: q.get("embed") === "harbor" && window.parent !== window
  };
})();
// Quick test (2026-11-11): the teacher, the admin, a test account, or ?quick=1 can play only Part 1
// and go straight to the wrap-up. Such a run is stored with metrics.test = true: it pays no chips and
// the teacher's reports list it as "快速測試" without counting it.
const PK_LINK_PARTS = PK_LINK.parts.slice();
let PK_QUICK = new URLSearchParams(location.search).get("quick") === "1" && !PK_LINK.embed;
if(PK_QUICK && !PK_LINK.parts.length) PK_LINK.parts = [1];
function pkCanQuick(){ const u = pkWho(); return !PK_LINK.embed && !PK_PREVIEW && (PK_QUICK || !!(u && (u.role === "teacher" || u.role === "admin" || u.test_account))); }
function pkSetQuick(on){
  PK_QUICK = !!on;
  PK_LINK.parts = PK_QUICK ? [1] : PK_LINK_PARTS.slice();
  if(SELECTED) initTopics();                                   // the table keeps only Part 1 (or all parts again)
  const goal = document.querySelector("#pkMissionBody .pk-goal");
  if(goal) goal.textContent = pkGoalText();
  PKT.log("mission.quick", { on: PK_QUICK });
}
function pkGoalText(){
  const total = pkSlides().length;
  if(PK_QUICK){ const n = SELECTED ? Object.keys(buildDB(SELECTED.topic, SELECTED.level).answers).length : 0; return "Quick test: Part 1 only ("+n+" cards), then straight to the wrap-up. This game is marked as a test: no chips, and it is not counted in the class."; }
  return "Today's goal: understand "+total+" slides, then read one aloud yourself.";
}
function pkClean(t){ t=String(t||"").replace(/^Topic\s*\d+\s*[:：]\s*/,"").trim(); return t.length>92?t.slice(0,90)+"…":t; }
function pkCode(id){ return window.topicCode ? window.topicCode(id) : String(id); }   // what a topic is shown as: 9-1 → 9-A
function pkEsc(s){ return String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }

function buildDB(topic, level){
  const slides = (topic.levels[level]||[]).slice().sort((a,b)=>a.no-b.no);
  const order=[], counters={}, subtopics={}, answers={}, partTitle={};
  slides.forEach(s=>{
    const pno = parseInt((String(s.part||"Part 1").match(/\d+/)||[1])[0], 10);
    if(PK_LINK.parts.length && !PK_LINK.parts.includes(pno)) return;
    if(!subtopics[pno]){ subtopics[pno]=[]; order.push(pno); }
    counters[pno]=(counters[pno]||0)+1;
    const sid = pno+"-"+counters[pno];
    subtopics[pno].push({ id:sid, no:s.no, part:pno, title:s.title_en||("Slide "+s.no), zh:s.title_zh||"", keywords:s.keywords||"" });
    answers[sid] = { english:s.script, no:s.no, part:pno };
    if(!partTitle[pno]) partTitle[pno] = s.title_en || ("Part "+pno);
  });
  order.sort((a,b)=>a-b);
  if(PK_LINK.merge && order.length>1){
    // One round with every selected part's cards on the table, so each match is a real choice.
    const all = order.flatMap(p=>subtopics[p]); const id = order[0];
    return { topics:[{ id, name:"Parts "+order[0]+"–"+order[order.length-1], subtitle:all.length+" cards · one round" }], subtopics:{ [id]:all }, answers };
  }
  const topics = order.map(p=>({ id:p, name:"Part "+p, subtitle:partTitle[p]||("Part "+p) }));
  return { topics, subtopics, answers };
}

// The menu is a card table (2026-11-09 redesign): a bar with the player and their chips, one line of
// instruction, and every topic as a poker card. Open topics are dealt face down and flip face up;
// the levels are casino chips on the card. A locked topic stays face down with a padlock.
let PK_SEL_DEALT = false;
const LEVEL_TONE = { A1:"#15803d", A2:"#1d4ed8", B1:"#6d28d9", B2:"#111827" };
function renderSelector(){
  const host = document.getElementById("selectorScreen"); if(!host) return;
  // A course that has opened topics shows only those; otherwise the shared open/locked rules apply.
  const acts = pkCourseActs();
  const bySdg = {};
  GAME_DATA.topics.filter(t=>!acts.length || acts.some(a=>a.topic_id===t.id)).forEach(t=>{ (bySdg[t.sdg]=bySdg[t.sdg]||[]).push(t); });
  let h = '<header class="pk-sel-bar"><div class="pk-sel-brand"><span class="pk-sel-logo" aria-hidden="true"><i></i></span>'
        + '<h1>SDG Pecha Kucha <span>Card Game</span></h1></div>' + pkWhoBar() + '</header>';
  if(!PK_READY){   // the course decides what is on the menu: nothing playable is shown before it is known
    host.innerHTML = h + '<div class="pk-felt pk-felt-wait"><div class="pk-ghosts" aria-hidden="true"><span></span><span></span><span></span></div>'
      + '<p class="pk-loading" role="status"><span class="pk-spin"></span>Loading your course and topics…</p></div>';
    pkWireWho();
    return;
  }
  h += '<ol class="pk-steps" aria-label="How to start"><li class="on"><b>1</b>Pick a topic card</li><li><b>2</b>Choose a level</li><li><b>3</b>Start matching</li></ol>';
  h += '<div class="pk-felt'+(PK_SEL_DEALT ? ' pk-dealt' : '')+'">';
  let n = 0;
  Object.keys(bySdg).map(Number).sort((a,b)=>a-b).forEach(sdg=>{
    const meta = SDG_META[sdg]||{c:"#2563eb",n:""};
    h += '<section class="pk-sdg" style="--ac:'+meta.c+'" aria-label="SDG '+sdg+'">'
       + '<h2 class="pk-sdg-label"><span class="pk-sdg-n">'+sdg+'</span>'+pkEsc(meta.n)+'</h2><div class="pk-sdg-cards">';
    bySdg[sdg].sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true})).forEach(t=>{
      const levels = LEVEL_ORDER.filter(l=>t.levels[l]);
      const locked = !pkTopicOpen(t.id), title = pkTitle(t), zh = pkTitleZh(t);
      const many = levels.length > 3 ? ' many' : '';

// The chip pile at the bottom left of the table is THIS run's chips (2026-11-09: "chips grow while
// playing"). Only the listening score pays during the matching (pk.score = score ÷ 10, at most 10,
// design 11-08 §全域個人籌碼; no combo bonus), so the pile shows that part of the server's rule as it
// builds up: every first-try match adds its share (a ring fills toward the next chip), a whole chip
// flies in when the share reaches one. When the run ends the pile is set to exactly what the score
// pays, capped by what is left of today's 60. The real chips are counted by the server in the
// wrap-up, which settles to the server's number (pk-wrapup.js paintChips). Guests see the pile too,
// marked 不入帳; inside the 3D game and in a teacher's preview there is no pile (no chips are paid).
// Pictures are rendered with Blender: scripts/blender/render_chips.py.
function pkChipTier(n){ return n >= 120 ? 12 : n >= 60 ? 8 : n >= 30 ? 5 : n >= 10 ? 3 : 1; }
function pkChipImg(n){ return "/static/assets/chips/stack-"+pkChipTier(n)+".png"; }
function pkPileImg(n){ const t = n <= 0 ? 0 : n >= 10 ? 12 : n >= 7 ? 8 : n >= 4 ? 5 : n >= 2 ? 3 : 1; return t ? "/static/assets/chips/stack-"+t+".png" : "/static/assets/chips/chip.png"; }
const PK_PILE = { shown:0, target:0, frac:0, tok:0 };
function pkChipRoom(){   // what is left of today's chips for a signed-in student (null = not known)
  if(PKT.mode() !== "user" || !PK_CHIPS || typeof PK_CHIPS.today !== "number") return null;
  return Math.max(0, (PK_CHIPS.daily_cap || 60) - PK_CHIPS.today);
}
// { whole, frac }: chips this run is worth so far by the listening-score rule.
function pkRunChips(){
  if(!RUN || PK_LINK.embed || PK_PREVIEW) return { whole:0, frac:0 };
  const room = pkChipRoom();
  const cap = v => Math.min(v, 10, room === null ? 10 : room);
  if(RUN.finished && RUN.summary){
    const sc = RUN.summary.score;
    return { whole: sc == null ? 0 : cap(Math.floor(sc / 10 + 0.5)), frac:0 };   // the server's rounding: half up
  }
  const n = Math.max(1, totalToMatchAll());
  const s = Object.values(RUN.cards).filter(c=>c.first!==null && c.k>=2).reduce((a,c)=>a+((c.first?1:0)-1/c.k)/(1-1/c.k), 0);
  const v = Math.max(0, s) * 10 / n, whole = cap(Math.floor(v + 1e-9));
  return { whole, frac: whole >= cap(10) ? 0 : v - Math.floor(v + 1e-9) };
}
function pkPaintWallet(bump){
  const el = document.getElementById("pkWallet"); if(!el) return;
  if(PK_LINK.embed || PK_PREVIEW){ el.hidden = true; return; }

  el.classList.toggle("guest", m !== "user");
  const img = document.getElementById("pkWalletImg"), src = innerWidth <= 640 ? "/static/assets/chips/chip.png" : pkPileImg(n);
  if(img.getAttribute("src") !== src) img.src = src;

// After every drop: bring the pile up to date. Chips fly from the card that was matched (from the
// middle of the table at the end of the run). Logging is done before this is called and never waits on it.
function pkPileUpdate(fromEl){
  if(PK_LINK.embed || PK_PREVIEW) return;
  const want = pkRunChips(), tok = PK_PILE.tok, add = want.whole - PK_PILE.target;
  PK_PILE.frac = want.frac; PK_PILE.target = want.whole;
  const img = document.getElementById("pkWalletImg");
  if(add > 0 && window.PKFX && PKFX.motion()){
    // A small shower of chips; the number goes up by one at a time as they land (never past the rule's number).
    const n = Math.min(12, Math.max(3, add * 2));
    let landed = 0;
    PKFX.chipsTo(fromEl, img, n, () => {
      landed++;
      if(PK_PILE.tok !== tok) return;               // a new run started meanwhile
      const due = PK_PILE.target - add + Math.floor(landed * add / n);
      if(due > PK_PILE.shown){ PK_PILE.shown = Math.min(due, PK_PILE.target); pkPaintWallet(true); PKFX.clink(img); }
    });
    pkPaintWallet(false);
    return;
  }
  if(add === 0 && want.frac > 0 && fromEl && window.PKFX) PKFX.spark(fromEl, img);   // part of a chip: a spark fills the ring
  PK_PILE.shown = want.whole;
  pkPaintWallet(add > 0);
}
function pkPileReset(){ PK_PILE.tok++; PK_PILE.shown = PK_PILE.target = 0; PK_PILE.frac = 0; pkPaintWallet(); }

async function pkLoadTts(){

// The accent in use: the student's choice when it is still offered, else the teacher's default; null = this device's voice.
function pkAccent(){

function pkAccEn(label){ return String(label||"").replace(/^[^\x00-\x7f]+\s*/, "") || String(label||""); }   // "美式 American" → "American"
// Two kinds of cloud voice (backend/tts.py): "-N2" codes are Google Neural2, whose word times are exact, so the

const PK_KIND = { n2:{ name:"Clear · exact highlight", short:"Clear" }, hd:{ name:"HD · most natural", short:"HD" } };
const pkKindOf = code => /-N2$/.test(String(code||"")) ? "n2" : "hd";
const pkBaseOf = code => String(code||"").replace(/-N2$/, "");
function pkKinds(){ return ["n2","hd"].filter(k=>PK_TTS.accents.some(a=>pkKindOf(a.code)===k)); }

function pkAccentLabel(code){ return code ? pkAccName(code) + (pkKinds().length > 1 ? " · " + PK_KIND[pkKindOf(code)].short : "") : "Device"; }

function pkSetAccent(code){

function pkCycleAccent(){

  const list = [...order, null], i = list.indexOf(pkAccent());

// ── Word-by-word highlighting (逐字高亮): the word being read is marked in the sentence on screen ──
// Where the time of each word comes from, best first: (1) the voice service's own word times, sent with
// the clip; (2) the browser's speech engine reporting each word as it starts (device voice); (3) an
// estimate from how long the words are, stretched over the clip's length. The teacher chooses the levels
// (老師後台 › 語音念法 › 逐字高亮); with "reduce motion" on, nothing moves and the text is simply shown.
function pkHiOn(){
  if(PK_LINK.embed) return false;   // the card-game station inside the 3D game: no word highlight (owner, 2026-11-13)
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return false;
  const lv = (typeof SELECTED !== "undefined" && SELECTED) ? SELECTED.level : null;
  return !!lv && PK_TTS.highlight.includes(lv);
}
function pkWordHtml(text){
  const t = String(text == null ? "" : text);
  if(!pkHiOn()) return escapeHTML(t);
  return t.trim().split(/\s+/).map((w,i)=>'<span class="pk-w" data-w="'+i+'">'+escapeHTML(w)+'</span>').join(" ");
}
let pkHiAt = -2, pkHiFrame = 0;
function pkHi(i){                                         // words before i are "said", word i is "now"
  if(i === pkHiAt) return; pkHiAt = i;
  document.querySelectorAll(".pk-w").forEach(el=>{ const k = +el.dataset.w; el.classList.toggle("said", k < i); el.classList.toggle("now", k === i); });
}
function pkHiEnd(){ cancelAnimationFrame(pkHiFrame); pkHiFrame = 0; pkHiAt = -2; document.querySelectorAll(".pk-w").forEach(el=>el.classList.remove("said","now")); }
// How long each word takes to say, roughly: its syllables, plus the pause after a comma or a full stop.
function pkWordWeights(words){
  return words.map(w=>{ const core = w.replace(/[^A-Za-z0-9]/g,""); const syl = Math.max(1, (core.toLowerCase().match(/[aeiouy]+/g)||[]).length, Math.ceil(core.replace(/[^0-9]/g,"").length * 1.5));
    return syl + (/[.!?]["')]*$/.test(w) ? 1.3 : /[,:]$/.test(w) ? 0.6 : 0) + 0.35; });
}
function pkEstimateTimes(words, seconds){
  const w = pkWordWeights(words), sum = w.reduce((a,b)=>a+b, 0) || 1; let at = 0;
  return w.map(x=>{ const t = at / sum * seconds; at += x; return t; });
}
// Follow a clock (the clip's position, or seconds since the voice started) through the word times.
function pkHiFollow(clock, times, my){
  cancelAnimationFrame(pkHiFrame);
  if(!pkHiOn() || !times || !times.length) return;
  const tick = () => {
    if(my !== pkSpeakToken) return;
    const t = clock(); let i = -1;
    for(let k = 0; k < times.length; k++){ if(times[k] <= t + 0.03) i = k; else break; }
    pkHi(i);
    pkHiFrame = requestAnimationFrame(tick);
  };
  pkHiFrame = requestAnimationFrame(tick);
}
function pkStopClip(){ const a = PK_TTS.audio; PK_TTS.audio = null; if(a){ try{ a.onended = a.onerror = null; a.pause(); }catch(e){} } }
// The mp3 of one sentence, or null when the browser should speak (the reason is remembered so a
// missing key or a used-up allowance is not asked about again for five minutes).
async function pkClip(text, accent){
  const key = accent+"|"+text;
  if(PK_TTS.clips.has(key)) return PK_TTS.clips.get(key);
  if(Date.now() < PK_TTS.offUntil) return null;
  const stop = typeof AbortController === "function" ? new AbortController() : null, timer = setTimeout(()=>{ if(stop) stop.abort(); }, 7000);
  try{
    const r = await fetch(pkApiBase()+"/content/tts?accent="+encodeURIComponent(accent)+"&text="+encodeURIComponent(text), stop ? { signal: stop.signal } : undefined);
    if(!r.ok){
      let why = ""; try{ why = (await r.json()).reason || ""; }catch(e){}
      if(why !== "not_in_material" && why !== "text") PK_TTS.offUntil = Date.now() + 5*60*1000;
      if(why === "not_in_material") PK_TTS.clips.set(key, null);
      return null;
    }
    // When the voice service said when each word starts, the times come with the clip (milliseconds, one per shown word).
    const head = r.headers.get("X-Word-Times");
    const times = head ? head.split(",").map(Number).filter(n => isFinite(n)).map(n => n / 1000) : null;
    const clip = { url: URL.createObjectURL(await r.blob()), times: times && times.length === String(text).trim().split(/\s+/).length ? times : null };
    PK_TTS.clips.set(key, clip);
    return clip;
  }catch(e){ return null; }
  finally{ clearTimeout(timer); }
}

/* ── Finishing a run: score, save, wrap-up ── */
function pkAuth(){ try{ return JSON.parse(localStorage.getItem("user")||"null"); }catch(e){ return null; } }
// Same rule as the server (backend/learning.py score_events): first drop of each card, corrected
// for guessing among the k title cards still open; cards with one place left are left out.
function pkScoreOf(list){
  const v = list.filter(c=>c.first!==null && c.k>=2).map(c=>((c.first?1:0)-1/c.k)/(1-1/c.k));
  return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null;
}
function pkSummary(){
  const cards = Object.values(RUN.cards), mean = pkScoreOf(cards);
  const parts = [...new Set(cards.map(c=>c.part))].sort((a,b)=>a-b).map(p=>({ part:p, s:pkScoreOf(cards.filter(c=>c.part===p)) }));
  return { cards, parts, score: mean==null ? null : Math.round(Math.max(0,mean)*100),
           seconds: completedPartRecords.reduce((a,p)=>a+(p.elapsed_seconds||0),0),
           errors: completedPartRecords.reduce((a,p)=>a+(p.errors||0),0),
           repeats: completedPartRecords.reduce((a,p)=>a+(p.repeat_listen_count||0),0) };
}

async function pkInit(){

function normalizeGameContent(payload) {
  const topics = [];
  const subtopics = {};
  const answers = {};

  (payload.parts || []).forEach((part) => {
    const partNo = Number(part.part_no);
    topics.push({
      id: partNo,
      partId: part.part_id,
      name: `Part ${partNo}`,
      subtitle: part.part_description
    });

    subtopics[partNo] = [];
    (part.sub_topics || []).forEach((topic) => {
      const subId = `${partNo}-${topic.sub_topic_no}`;
      subtopics[partNo].push({
        id: subId,
        title: topic.sub_topic_description,
        subTopicId: topic.sub_topic_id
      });

      if (topic.card && topic.card.card_text) {
        answers[subId] = {
          english: topic.card.card_text,
          cardId: topic.card.card_id
        };
      }
    });
  });

  return { topics, subtopics, answers };
}

}

// On a small screen some title cards can sit under the dock or above the top edge. A pill above the
// dock says how many and scrolls to them, so four visible cards are never mistaken for the whole table.
function pkTableCue(){
  const game = document.getElementById("gameScreen"); if(!game) return;
  let cue = document.getElementById("pkMoreCue");
  if(!cue){ cue = document.createElement("button"); cue.type = "button"; cue.id = "pkMoreCue"; cue.className = "pk-more-cue"; cue.hidden = true; game.appendChild(cue); }
  const open = [...document.querySelectorAll("#subBox .subtopic-poker:not(.correct):not(.pk-decoy-out)")];
  if(game.classList.contains("hidden") || !open.length){ cue.hidden = true; return; }
  const holder = document.getElementById("dealtCardHolder").getBoundingClientRect(), timer = document.getElementById("gameTimer").getBoundingClientRect();
  const limit = (innerWidth <= 640 ? Math.min(holder.top, timer.top) : holder.top) - 6;     // where the dock starts to cover the table
  const rects = open.map(c=>c.getBoundingClientRect());
  const below = rects.filter(r=>r.bottom - limit > Math.max(24, r.height*0.25)), above = rects.filter(r=>-r.top > Math.max(24, r.height*0.25));
  if(below.length){ cue.textContent = "↓ "+below.length+" more below"; cue.onclick = () => scrollBy({ top: Math.max(...below.map(r=>r.bottom)) - limit + 10, behavior:"smooth" }); }
  else if(above.length){ cue.textContent = "↑ "+above.length+" more above"; cue.onclick = () => scrollTo({ top:0, behavior:"smooth" }); }
  cue.hidden = !(below.length || above.length);
  cue.style.bottom = Math.round(innerHeight - limit + 4) + "px";
}
function pkCueSoon(){ if(pkCueSoon.t) return; pkCueSoon.t = requestAnimationFrame(() => { pkCueSoon.t = 0; pkTableCue(); }); }
// The sentence in hand must be readable in full. If it does not fit: the hint under it gives up its
// room, then the type gets smaller (down to 12 px), then on a phone the hand card grows taller
// (--hand-h; the timer and the chips above it move up with it). Only if all that is not enough
// does the card scroll, and it says so.
function pkFitHand(){
  const game = document.getElementById("gameScreen"), card = document.querySelector("#dealtCardHolder .poker-card");
  game.style.removeProperty("--hand-h");
  if(!card){ pkCueSoon(); return; }
  const t = card.querySelector(".card-scroll-text"); if(!t) return;
  card.classList.remove("pk-tight", "pk-scroll"); t.style.removeProperty("font-size");
  const over = () => t.scrollHeight > t.clientHeight + 1;
  if(!over()) return;
  card.classList.add("pk-tight");
  let px = parseFloat(getComputedStyle(t).fontSize) || 15;
  while(over() && px > 12){ px -= 0.5; t.style.setProperty("font-size", px+"px", "important"); }
  if(innerWidth <= 640){ let hh = 178; while(over() && hh < 258){ hh += 8; game.style.setProperty("--hand-h", hh+"px"); } }
  if(over()) card.classList.add("pk-scroll");
  pkCueSoon();
}

async function loadTopic(id, el) {
  pkQuiet();
  const sentBox = document.getElementById("sentenceBox");

  sentBox.innerHTML = "";

  // Create the backend session only after every part is complete.

  // Reset the current part state.

  el.classList.add("active");

  repeatListenCount = 0;
  Object.keys(repeatListenStats).forEach(k => delete repeatListenStats[k]);

  const subs = DB.subtopics[id];
  totalToMatch = subs.length;
  updateProgress();
  const box = document.getElementById("subBox");
  if (window.PKFX) PKFX.sweep(box);
  box.innerHTML = "";
  pkPartNote("");
  updateStatus("Dealing…");
  const decoy = pkPickDecoy(subs);
  box.classList.toggle("has-decoy", !!decoy);
  const table = subs.slice();
  if (decoy) table.splice(Math.floor(Math.random() * (table.length + 1)), 0, decoy);
  box.classList.toggle("pk-many", table.length >= 5);     // phone: three narrow columns, so five cards are two rows
  PKT.log("part.start", { part:id, cards:subs.length, decoy: decoy ? pkCardId(decoy.no) : null }, { stage:id });

  // Cards are dealt one by one on timers. If the student picks another part meanwhile, the cards
  // still on their way belong to a table that is gone: this number tells them so.
  const dealing = ++pkDealRound;
  table.forEach((s, index) => {
    setTimeout(() => {
      if (dealing !== pkDealRound) return;
      const card = document.createElement("div");
      const fx = window.PKFX && PKFX.motion();
      card.className = "poker-card subtopic-poker" + (fx ? " pk-facedown" : " dealing");
      // The fly-in runs once. With the class left on, clearing the "wrong card" shake started the
      // fly-in again: the card vanished and was dealt a second time.
      card.addEventListener("animationend", e => { if (e.animationName === "flyIn") card.classList.remove("dealing"); });
      card.dataset.subId = s.id;
      card.dataset.no = s.no;
      card.dataset.letter = String.fromCharCode(65 + index);
      if (s.decoy) card.dataset.decoy = "1";
      card.innerHTML = `
        <div class="card-inner">
          <div class="card-front">
            <div class="match-card-face">
              <span class="pk-corner tl">${String.fromCharCode(65 + index)}<i></i></span><span class="pk-corner br">${String.fromCharCode(65 + index)}<i></i></span>
              <div class="card-title">${escapeHTML(s.title)}</div>
              ${s.keywords || s.zh ? `<div class="card-kw">${escapeHTML(s.keywords || s.zh)}</div>` : ""}
              <div class="drop-hint">Drop or click here</div>
            </div>
          </div>
          <div class="card-back">SDG</div>
        </div>`;
      card.ondragover  = e => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        if (canDrag && currentCardData && !card.classList.contains('correct')) card.classList.add('drop-over');
      };
      card.ondragleave = () => card.classList.remove('drop-over');
      card.ondrop      = e => {
        e.preventDefault();
        card.classList.remove('drop-over');
        clearDropFeedback();
        if (!canDrag || !currentCardData) return;
        handleDrop(currentCardData, s.id, card);
      };
      card.tabIndex = 0; card.setAttribute("role", "button"); card.setAttribute("aria-label", "Slide " + String.fromCharCode(65 + index) + ": " + s.title);
      card.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); card.click(); } };
      card.onclick = () => {
        if (card.classList.contains('correct')) return;
        if (card.dataset.busy) return;                       // the second tap of a double tap
        card.dataset.busy = "1"; setTimeout(() => { delete card.dataset.busy; }, 450);
        if (!currentCardData) {
          updateStatus("Tap the deck to draw a sentence card first.");
          return;
        }
        if (!canDrag) {
          updateStatus("Listen to the whole sentence first, then choose a slide card.");
          return;
        }
        clearDropFeedback();
        handleDrop(currentCardData, s.id, card);
      };
      box.appendChild(card);
      if (fx) PKFX.dealIn(card, document.getElementById("mainDeck"));
      if (index === table.length-1)
        setTimeout(() => { if (dealing === pkDealRound) { updateStatus("The cards are dealt. Tap the deck to draw a sentence card."); pkTableCue(); } }, 600);
    }, index * 200);
  });

  // Shuffle the hand cards.
  gameData = subs.map(s => ({ ...DB.answers[s.id], subId: s.id }));
  gameData.sort(() => Math.random() - 0.5);
  pkVoiceSync();
}

/* ── Deal hand cards ── */
function dealNextCard() {
  if (!currentTopic)   return updateStatus("Choose a part first: tap 1–6 above.");
  if (currentCardData) return updateStatus("Match the sentence in your hand first.");
  if (gameData.length === 0) return updateStatus("This part is done. Choose the next one.");

  canDrag = false;
  currentCardData = gameData.pop();
  if (RUN) {
    RUN.dealt++;
    RUN.cur = { id:pkCardId(currentCardData.no), part:currentCardData.part, repeats:0, listenEnd:performance.now(), audioEnd:performance.now() };
    PKT.log("card.deal", { card:RUN.cur.id, part:currentCardData.part, n:RUN.dealt, review:RUN.review.has(RUN.cur.id) }, { stage:currentCardData.part });
  }
  const holder = document.getElementById("dealtCardHolder");

  const cardDiv = document.createElement("div");
  cardDiv.className = "poker-card draggable";
  cardDiv.innerHTML = `
    <div class="card-inner">
      <div class="card-front">
        <div class="playable-card-face">
          <div class="card-kicker">Sentence</div>
          <div class="card-scroll-text">${pkWordHtml(currentCardData.english)}</div>
          <div class="drag-hint">Listen first</div>
        </div>
      </div>
      <div class="card-back">SDG</div>
    </div>
    <div class="card-controls">
      <button class="card-action-btn secondary listen-btn" type="button">Listen</button>
      <button class="card-action-btn repeat-btn" type="button" disabled>Repeat</button>
      <span class="repeat-count-chip">0 repeats</span>
    </div>`;

  cardDiv.ondragstart = e => {
    if (!canDrag) { e.preventDefault(); return; }
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', currentCardData.subId);
    cardDiv.classList.add('dragging');
    document.body.classList.add('is-dragging-card');
    markDropTargets();
  };
  cardDiv.ondragend = () => {
    cardDiv.classList.remove('dragging');
    clearDropFeedback();
  };

  const listenBtn = cardDiv.querySelector(".listen-btn");
  const repeatBtn = cardDiv.querySelector(".repeat-btn");
  const repeatChip = cardDiv.querySelector(".repeat-count-chip");

  function playCard({ isRepeat = false } = {}) {
    if (!currentCardData || isSpeaking) return;
    const hasListened = cardDiv.dataset.hasListened === "true";
    if (isRepeat && !hasListened) {
      updateStatus("Listen once first.");
      return;
    }
    if (!isRepeat && hasListened) {
      updateStatus("It has been read. Tap the speaker to hear it again.");
      return;
    }

    if (!cardDiv.classList.contains('flipped')) cardDiv.classList.add("flipped");
    isSpeaking = true;
    listenBtn.disabled = true;
    repeatBtn.disabled = true;
    canDrag = false;
    updateStatus(isRepeat ? "Reading again…" : "Reading… listen for the main idea.");

    if (isRepeat) {
      repeatListenCount++;
      const key = currentCardData.cardId || currentCardData.subId;
      repeatListenStats[key] = (repeatListenStats[key] || 0) + 1;
      overallRepeatListenStats[key] = (overallRepeatListenStats[key] || 0) + 1;
      repeatChip.textContent = `${repeatListenStats[key]} repeat${repeatListenStats[key] > 1 ? 's' : ''}`;
      if (RUN && RUN.cur) { RUN.cur.repeats++; PKT.log("card.repeat", { card:RUN.cur.id, n:RUN.cur.repeats }, { stage:currentCardData.part }); }
    }

    pkVoiceSync(true);
    const spokeAt = performance.now(), spokenCard = RUN && RUN.cur;
    speak(currentCardData.english, () => {
      const heardAt = performance.now();
      if (RUN && spokenCard && RUN.cur === spokenCard) {
        if (!isRepeat) { spokenCard.listenEnd = heardAt; PKT.log("card.listen", { card:spokenCard.id, seconds:+((heardAt - spokeAt) / 1000).toFixed(1) }, { stage:spokenCard.part }); }
        spokenCard.audioEnd = heardAt;
      }
      isSpeaking = false;
      cardDiv.dataset.hasListened = "true";
      startTimer(); // timer starts only after the first required reading is finished
      canDrag = true;
      cardDiv.draggable = true;
      listenBtn.disabled = true;
      repeatBtn.disabled = false;
      const dragHint = cardDiv.querySelector('.drag-hint');
      if (dragHint) dragHint.textContent = 'Drag to the right card, or tap it';
      cardDiv.style.boxShadow = "0 0 22px gold";
      updateStatus("Drag the sentence onto the slide card it belongs to, or just tap that card.");
      pkVoiceSync();
    });
  }

  listenBtn.onclick = e => { e.stopPropagation(); playCard({ isRepeat:false }); };
  repeatBtn.onclick = e => { e.stopPropagation(); playCard({ isRepeat:true }); };
  cardDiv.onclick = () => {
    if (cardDiv.dataset.hasListened === "true") {
      updateStatus("It has been read. Tap the speaker to hear it again.");
      return;
    }
    playCard({ isRepeat:false });
  };

  holder.appendChild(cardDiv);
  if (window.PKFX && PKFX.motion()) PKFX.dealHand(cardDiv, document.getElementById("mainDeck"));
  pkFitHand();
  pkVoiceSync();
  updateStatus("Tap the speaker to hear this sentence. The clock starts when it ends.");
}


function markDropTargets() {
  document.querySelectorAll('.subtopic-poker:not(.correct)').forEach(card => card.classList.add('drop-ready'));
}
function clearDropFeedback() {
  document.body.classList.remove('is-dragging-card');
  document.querySelectorAll('.subtopic-poker').forEach(card => card.classList.remove('drop-ready', 'drop-over'));
}

/* ── Matching logic ── */
async function handleDrop(cardData, targetSubId, targetEl) {
  // Every drop is one learning event. k = title cards still open on the table (decoy included):
  // the chance of a lucky guess, which the score takes out.
  if (RUN && RUN.cur) {
    const cid = RUN.cur.id, now = performance.now(), right = cardData.subId === targetSubId;
    const k = document.querySelectorAll('#subBox .subtopic-poker:not(.correct)').length;
    const targetNo = Number(targetEl.dataset.no);
    const rec = RUN.cards[cid] || (RUN.cards[cid] = { id:cid, no:cardData.no, part:cardData.part, first:null, k, attempts:0, repeats:0, wrongNos:[], done:false });
    rec.attempts++; rec.repeats = RUN.cur.repeats;
    if (rec.first === null) { rec.first = right; rec.k = k; }
    if (right) rec.done = true; else rec.wrongNos.push(targetNo);
    RUN.streak = right ? (rec.attempts === 1 ? RUN.streak + 1 : RUN.streak) : 0;
    pkShowStreak();
    PKT.log("card.drop", { card:cid, target:pkCardId(targetNo), correct:right, attempt:rec.attempts, k,
                           rt_ms:Math.round(now - RUN.cur.listenEnd), since_audio_ms:Math.round(now - RUN.cur.audioEnd),
                           repeats:RUN.cur.repeats, decoy:targetEl.dataset.decoy === "1", review:RUN.review.has(cid) }, { stage:cardData.part });
    if (window.PKFX) { if (right) PKFX.matchWin(targetEl, rec.attempts === 1); else PKFX.miss(targetEl); }
    pkPileUpdate(targetEl);
  }
  if (cardData.subId === targetSubId) {
    // Correct match.
    matchedCount++;
    updateProgress();
    targetEl.classList.add("correct");
    const front = targetEl.querySelector('.card-front');
    front.style.fontSize = "";
    const matchedTitle = DB.subtopics[currentTopic].find(s => s.id === targetSubId).title;
    front.innerHTML = `
      <div class="correct-card-face">
        <span class="pk-corner tl">${escapeHTML(targetEl.dataset.letter || "")}<i></i></span><span class="pk-check" aria-label="Correct">✓</span>
        <div class="card-title">${escapeHTML(matchedTitle)}</div>
        <div class="correct-text">${escapeHTML(cardData.english)}</div>
      </div>`;

    document.getElementById("dealtCardHolder").innerHTML = "";
    currentCardData = null;
    canDrag = false;
    pkVoiceSync();
    pkFitHand();

    if (matchedCount === totalToMatch) {
      /* ── Part complete ── */
      stopTimer();
      const elapsed = timerSeconds;
      const errors  = errorCount;
      const completedTopicNo = currentTopic;
      const backendPartId = DB.topics.find(t => t.id === currentTopic)?.partId || currentTopic;

      // Mark this part as complete.
      partStatus[completedTopicNo] = 'completed';
      const btn = document.getElementById(`topic-btn-${completedTopicNo}`);
      if (btn) { btn.classList.remove("active"); btn.classList.add("completed"); }
      currentTopic = null;

      const partRecord = {
        part_no: completedTopicNo,
        part_id: backendPartId,
        errors,
        elapsed_seconds: elapsed,
        elapsed_text: formatTime(elapsed),
        repeat_listen_count: repeatListenCount,
        card_repeat_listens: { ...repeatListenStats }
      };
      completedPartRecords.push(partRecord);

      
      updateProgress();
      PKT.log("part.done", { part:completedTopicNo, errors, seconds:elapsed, repeats:repeatListenCount }, { stage:completedTopicNo });
      pkPartDone(completedTopicNo);

      // Self-contained: show a completion summary once every part is done.
      const doneCount = Object.values(partStatus).filter(v => v === 'completed').length;
      if (doneCount === DB.topics.length) {
        updateStatus("All six parts done!");
        const finished = RUN; pkCommitRun();
        if (window.PKFX) PKFX.runWin(document.getElementById("subBox"));
        pkPileUpdate(document.getElementById("subBox"));
        setTimeout(() => { if (RUN === finished) pkOpenWrap(); }, 900);
      } else if (PK_LINK.embed) {
        setTimeout(pkOpenNextPart, 1200);
      }

    } else {
      updateStatus(`Matched! ${totalToMatch - matchedCount} to go. Tap the deck.`);
    }

  } else {
    // Incorrect match.
    errorCount++;
    updateStatus("Not this one. Try again.");
    if (!window.PKFX || !RUN) { targetEl.style.animation = "shake 0.4s"; setTimeout(() => { targetEl.style.animation = ""; }, 400); }
  }
}

/* ── Speech playback ── */
function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

// Sentence by sentence (Chrome's network voices stop after ~15 s without an "end" event),
// with a timer so the card always becomes draggable even if the browser never reports the end.
let pkSpeakToken = 0;
function speak(text, onEndCallback) {
  window.speechSynthesis.cancel();
  const box = document.getElementById("sentenceBox");
  box.classList.add("active");
  box.innerHTML = `<div class="sentence-text">${pkWordHtml(text)}</div>`;
  const my = ++pkSpeakToken;
  pkHiEnd();
  const shown = String(text).trim().split(/\s+/);
  let finished = false;
  const done = () => {
    if (finished || my !== pkSpeakToken) return;
    finished = true; clearTimeout(guard); pkHiEnd();
    setTimeout(() => { if (my !== pkSpeakToken) return; box.classList.remove("active"); activeUtterance = null; if (onEndCallback) onEndCallback(); }, 350);
  };
  const rate = 0.82 * pkRate();
  const words = String(text).split(/\s+/).length;
  let guard = setTimeout(done, (words / (2.4 * rate)) * 1500 + 2500 + 7000);
  const accent = pkAccent();
  if (accent) {
    // The cloud voice first; the browser's voice the moment anything is missing or slow.
    pkClip(String(text), accent).then(clip => {
      if (finished || my !== pkSpeakToken) return;
      if (!clip) return byBrowser();
      const a = new Audio(clip.url);
      PK_TTS.audio = a;
      a.playbackRate = Math.max(0.6, Math.min(1.4, 0.95 * pkRate()));
      a.onloadedmetadata = () => { if (isFinite(a.duration) && a.duration > 0) { clearTimeout(guard); guard = setTimeout(done, (a.duration / a.playbackRate) * 1000 + 2500);
        // the service's word times when it sent them; otherwise an estimate over the clip's real length
        pkHiFollow(() => a.currentTime, clip.times || pkEstimateTimes(shown, a.duration), my); } };
      a.onended = () => { if (PK_TTS.audio === a) PK_TTS.audio = null; done(); };
      a.onerror = () => { if (PK_TTS.audio === a) PK_TTS.audio = null; if (!finished && my === pkSpeakToken) byBrowser(); };
      const p = a.play(); if (p && p.catch) p.catch(() => { if (PK_TTS.audio === a) PK_TTS.audio = null; if (!finished && my === pkSpeakToken) byBrowser(); });
    });
    return;
  }
  byBrowser();
  function byBrowser() {
  const parts = String(text).split(/(?<=[.!?])\s+/).map(t => t.trim()).filter(Boolean);
  let offset = 0;                                           // index of the part's first word in the whole sentence
  parts.forEach((t, i) => {
    const said = window.CardLearnSay ? window.CardLearnSay(t) : t;
    const u = new SpeechSynthesisUtterance(said);   // what is spoken, not what is shown (js/speech-say.js)
    // Highlighting with the device's voice: the engine reports each spoken word (onboundary). A shown word
    // may be several spoken ones (SDGs → S D Gs), so spoken word n is mapped back to the shown word.
    const words = t.split(/\s+/), first = offset; offset += words.length;
    const owner = []; words.forEach((w, k) => { const n = (window.CardLearnSay ? window.CardLearnSay(w) : w).split(/\s+/).filter(Boolean).length; for (let x = 0; x < n; x++) owner.push(first + k); });
    let heardBoundary = false;
    u.onboundary = e => {
      if (my !== pkSpeakToken || (e.name && e.name !== "word")) return;
      heardBoundary = true; cancelAnimationFrame(pkHiFrame);
      const n = said.slice(0, e.charIndex).split(/\s+/).filter(Boolean).length;
      if (pkHiOn() && owner.length) pkHi(owner[Math.min(n, owner.length - 1)]);
    };
    u.onstart = () => {
      if (my !== pkSpeakToken || !pkHiOn()) return;
      // Until (and unless) the engine reports words, follow an estimate; many phones never report them.
      const began = performance.now(), est = pkEstimateTimes(words, said.split(/\s+/).length / (2.6 * rate));
      cancelAnimationFrame(pkHiFrame);
      const tick = () => {
        if (my !== pkSpeakToken || heardBoundary) return;
        const t = (performance.now() - began) / 1000; let k = -1;
        for (let q = 0; q < est.length; q++) { if (est[q] <= t) k = q; else break; }
        pkHi(k < 0 ? first - 1 : first + k);
        pkHiFrame = requestAnimationFrame(tick);
      };
      pkHiFrame = requestAnimationFrame(tick);
    };
    if (cachedVoice) u.voice = cachedVoice;
    u.lang = "en-US"; u.rate = rate; u.pitch = 1;
    u.onerror = event => { console.warn("Speech synthesis error", event); done(); };
    if (i === parts.length - 1) u.onend = done;
    activeUtterance = u;
    speechSynthesis.speak(u);
  });
  if (!parts.length) done();
  }
}
pkLoadTts();

async function saveFullAttemptRecord() { return null; }

function updateProgress() {
  const number = document.getElementById("progressNumber");
  const fill = document.getElementById("progressFill");
  if (!number || !fill) return;
  const total = totalToMatch || 0;
  number.textContent = `${matchedCount} / ${total}`;
  fill.style.width = total ? `${Math.round((matchedCount / total) * 100)}%` : "0%";
}

/* ── Utilities ── */
function updateStatus(msg) {
  document.getElementById("status").textContent = msg;
}
